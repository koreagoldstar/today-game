<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1624" />
    <title>넘버 홀</title>
    <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Jua&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-bgm="number-hole">
    <div class="stage">
      <canvas id="game" width="390" height="700"></canvas>

      <div class="hud">
        <div class="panel">
          <span>점수 <b id="hud-score">0</b></span>
          <span>숫자 <b id="hud-power">2</b></span>
          <div class="xp" aria-hidden="true"><i id="xp-fill"></i></div>
        </div>
        <div class="panel right">
          <span>세력 <b id="hud-colony">1</b></span>
          <span>콤보 <b id="hud-combo">0</b></span>
          <span>시간 <b id="hud-time">75</b></span>
        </div>
      </div>
      <div class="hint" id="hint">작은 건 흡수 · 같은 숫자는 합체 · 미니 세포로 세력 확장!</div>

      <div class="overlay" id="title">
        <img class="title-thumb" src="assets/thumb.png" alt="" width="128" height="128" />
        <div class="badge">CELL COLONY</div>
        <h1>넘버 홀</h1>
        <p>
          작은 세포를 먹고, <b>같은 숫자</b>는 이어 붙여 합체!<br />
          미니 세포가 늘어나며 세력이 퍼져요.
        </p>
        <ul class="rules">
          <li><i>1</i> 작은 세포만 흡수</li>
          <li><i>2</i> 같은 숫자끼리 합체 → 레벨업</li>
          <li><i>3</i> 증식한 미니 세포가 자동 사냥</li>
        </ul>
        <button type="button" class="btn" id="start-btn">시작</button>
        <a href="/">← 오늘의 게임</a>
      </div>

      <div class="overlay hidden" id="over">
        <div class="badge" id="over-badge">TIME UP</div>
        <h1 id="over-title">종료!</h1>
        <p id="over-detail"></p>
        <button type="button" class="btn" id="retry-btn">다시</button>
        <a href="/">← 오늘의 게임</a>
      </div>
    </div>
    <script src="/js/bgm.js"></script>
    <script src="/js/scores.js"></script>
    <script src="/js/game-rank.js"></script>
    <script src="/js/pause.js"></script>
    <script src="game.js?v=5"></script>
  </body>
</html>
