<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#5a8ab8" />
    <title>날씨 피하기</title>
    <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Jua&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-bgm="weather-dodge">
    <div class="stage">
      <canvas id="game" width="390" height="700"></canvas>

      <div class="hud">
        <div class="panel">
          <span>WAVE <b id="hud-wave">1</b></span>
          <span>점수 <b id="hud-score">0</b></span>
        </div>
        <div class="panel right">
          <span>최고 <b id="hud-best">0</b></span>
          <div class="lives" id="hud-lives"></div>
        </div>
      </div>
      <div class="warn" id="warn"></div>
      <div class="wave-meter"><i id="wave-fill"></i></div>

      <div class="pad" id="pad">
        <button type="button" class="pad-btn" id="btn-left" aria-label="왼쪽">◀</button>
        <button type="button" class="pad-btn act umbrella" id="btn-umbrella">우산</button>
        <button type="button" class="pad-btn act hide" id="btn-hide">숨기</button>
        <button type="button" class="pad-btn act jump" id="btn-jump">점프</button>
        <button type="button" class="pad-btn" id="btn-right" aria-label="오른쪽">▶</button>
      </div>

      <div class="overlay" id="title">
        <img class="title-thumb" src="assets/thumb.png" alt="" width="140" height="140" />
        <div class="badge">WEATHER DODGE</div>
        <h1>날씨 피하기</h1>
        <p>
          비·번개·돌풍·우박을 버티세요<br />
          우산 · 점프 · 덤불 숨기!
        </p>
        <div class="tips">
          <span>💧 비 → 우산</span>
          <span>⚡ 번개 → 숨기</span>
          <span>🍃 돌풍 → 점프</span>
          <span>🧊 우박 → 점프</span>
        </div>
        <button type="button" class="btn" id="start-btn">날씨 도전!</button>
        <a href="/">← 오늘의 게임</a>
      </div>

      <div class="overlay hidden" id="clear">
        <div class="badge soft">WAVE CLEAR</div>
        <h1>날씨가 잠잠해졌어요</h1>
        <p id="clear-detail"></p>
        <button type="button" class="btn" id="next-btn">다음 웨이브</button>
      </div>

      <div class="overlay hidden" id="over">
        <div class="badge">STORMED</div>
        <h1>날씨에 당했어요</h1>
        <p id="over-detail"></p>
        <button type="button" class="btn" id="retry-btn">다시 도전</button>
        <a href="/">← 오늘의 게임</a>
      </div>

      <div class="overlay hidden" id="allclear">
        <div class="badge">ALL CLEAR</div>
        <h1>날씨 마스터!</h1>
        <p id="all-detail"></p>
        <button type="button" class="btn" id="again-btn">처음부터</button>
        <a href="/">← 오늘의 게임</a>
      </div>
    </div>
    <script src="/js/bgm.js"></script>
    <script src="/js/scores.js"></script>
    <script src="/js/game-rank.js"></script>
    <script src="/js/pause.js"></script>
    <script src="game.js"></script>
  </body>
</html>
