<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#7ec8ff" />
    <title>펄럭 병아리 — 아케이드 · 랭킹 | 오늘의 게임</title>
    <meta name="description" content="클릭이나 탭으로 캐릭터를 날아오르게 해 장애물을 통과하는 랭킹형 아케이드 게임입니다. 탭할 때마다 캐릭터가 위로 날아오릅니다. 파이프 사이 틈을 통과하며 점수를 쌓으세요." />
    <meta property="og:description" content="클릭이나 탭으로 캐릭터를 날아오르게 해 장애물을 통과하는 랭킹형 아케이드 게임입니다. 탭할 때마다 캐릭터가 위로 날아오릅니다. 파이프 사이 틈을 통과하며 점수를 쌓으세요." />
    <link rel="canonical" href="https://www.todaygame.co.kr/games/flappy/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="오늘의 게임" />
    <meta property="og:title" content="펄럭 병아리 | 오늘의 게임" />
    <meta property="og:url" content="https://www.todaygame.co.kr/games/flappy/" />
    <meta property="og:image" content="https://www.todaygame.co.kr/assets/thumbs/flappy.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Jua&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css?v=h1" />
      <link rel="stylesheet" href="/css/game-seo.css?v=3" />
    <link rel="stylesheet" href="/css/game-chrome.css?v=6" />
  </head>
  <body data-bgm="flappy" data-face="1">
    <div class="stage">
      <div class="hud">
        <a class="home" href="/">← 홈</a>
        <div class="score-pill">점수 <b id="hud-score">0</b></div>
        <div class="score-pill soft">최고 <b id="hud-best">0</b></div>
      </div>
      <canvas id="game" width="390" height="700"></canvas>
      <p class="hint">탭 / 스페이스로 펄럭!</p>

      <div class="overlay" id="title">
        <div class="badge">FLAP</div>
        <img class="hero-art" src="assets/thumb.webp" alt="" width="140" height="140" />
        <h1>펄럭 병아리</h1>
        <p>파이프 사이로 멀리 날아가<br />랭킹에 이름을 남겨요</p>
        <button type="button" class="btn" id="start-btn">시작!</button>
        <a class="link" href="/">← 오늘의 게임</a>
      </div>

      <div class="overlay hidden" id="over">
        <div class="badge">CRASH</div>
        <h2 data-h1>떨어졌어요!</h2>
        <p id="over-detail"></p>
        <form class="rank-form" id="rank-form">
          <label for="player-name">랭킹 이름 (2~8자)</label>
          <input id="player-name" name="name" maxlength="8" minlength="2" autocomplete="nickname" placeholder="닉네임" required />
          <button type="submit" class="btn" id="submit-btn">랭킹 등록</button>
          <p class="rank-msg" id="rank-msg"></p>
        </form>
        <button type="button" class="btn soft" id="share-rank-btn" hidden>내 결과 공유</button>
        <button type="button" class="btn soft" id="retry-btn">다시!</button>
        <a class="link" href="/">← 오늘의 게임</a>
      </div>
    </div>
    <script src="/js/today-audio.js?v=2"></script>
    <script src="/js/game-chrome.js?v=6"></script>
    <script src="/js/bgm.js?v=6"></script>
    <script src="/js/scores.js"></script>
    <script src="/js/retention.js"></script>
    <script src="/js/game-rank.js"></script>
    <script src="/js/pause.js?v=3"></script>
    <script src="/js/my-face.js?v=3"></script>

    <script src="game.js?v=face1"></script>
      <!-- seo:game:start -->
<section class="seo-about" aria-label="펄럭 병아리 소개">
  <h2>펄럭 병아리 소개</h2>
  <p>클릭이나 탭으로 캐릭터를 날아오르게 해 장애물을 통과하는 랭킹형 아케이드 게임입니다.</p>
  <h3>플레이 방법</h3>
  <p>탭할 때마다 캐릭터가 위로 날아오릅니다. 파이프 사이 틈을 통과하며 점수를 쌓으세요.</p>
  <h3>자주 묻는 질문</h3>
  <dl>
    <dt>최고 기록이 저장되나요?</dt>
    <dd>네, 최고 기록이 저장되어 랭킹에 반영됩니다.</dd>
  </dl>
</section>
<!-- seo:game:end -->

      <script src="/js/game-seo.js?v=1"></script>
  </body>
</html>
