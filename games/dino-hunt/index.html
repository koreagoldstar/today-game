<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1a3a24" />
    <meta name="description" content="다가오는 공룡을 쏘고, 위험하면 나무로 피하세요. 잡을수록 총이 업그레이드됩니다!" />
    <link rel="canonical" href="https://www.todaygame.co.kr/games/dino-hunt/" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/assets/pwa-icon-192.png" />
    <title>공룡 헌터 · 오늘의 게임</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Jua&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css?v=1" />
  </head>
  <body data-bgm="dino-hunt">
    <main class="stage">
      <canvas id="game" width="390" height="700" aria-label="공룡 헌터 게임"></canvas>

      <div class="hud">
        <div class="hud-block">
          <span>KILL</span>
          <strong id="hud-kills">0</strong>
        </div>
        <div class="hud-weapon">
          <span id="hud-weapon-name">권총</span>
          <div class="xp-track"><i id="hud-xp"></i></div>
        </div>
        <div class="hud-block right">
          <span>SCORE</span>
          <strong id="hud-score">0</strong>
        </div>
      </div>

      <p class="coach" id="coach">터치·마우스로 조준해서 쏘세요</p>

      <div class="controls">
        <button type="button" class="pad" id="left-btn" aria-label="왼쪽">◀</button>
        <button type="button" class="pad climb" id="climb-btn">나무 타기</button>
        <button type="button" class="pad" id="right-btn" aria-label="오른쪽">▶</button>
        <button type="button" class="fire" id="fire-btn">발사</button>
      </div>

      <div class="overlay" id="title">
        <img class="hero-art" src="assets/thumb.png" alt="" width="150" height="150" />
        <p class="eyebrow">DINO HUNT</p>
        <h1>공룡 <em>헌터</em></h1>
        <p>직접 조준해서 공룡을 사냥하고<br />위험하면 나무로 피하세요!</p>
        <ul class="rules">
          <li><b>1</b>터치/마우스로 조준 후 발사</li>
          <li><b>2</b>나무 근처에서 나무 타기</li>
          <li><b>3</b>많이 잡을수록 총 업그레이드</li>
        </ul>
        <button type="button" class="primary" id="start-btn">사냥 시작</button>
        <a href="/">← 오늘의 게임</a>
      </div>

      <div class="overlay hidden" id="upgrade">
        <p class="eyebrow soft">WEAPON UP</p>
        <h1 id="upgrade-title">샷건 해금!</h1>
        <p id="upgrade-detail">화력이 강해졌습니다</p>
        <button type="button" class="primary" id="upgrade-btn">계속 사냥</button>
      </div>

      <div class="overlay hidden" id="game-over">
        <p class="eyebrow">HUNT OVER</p>
        <h1>사냥 종료</h1>
        <p id="over-detail"></p>
        <div class="final-stats">
          <span>처치 <b id="final-kills">0</b></span>
          <span>최고 총 <b id="final-weapon">권총</b></span>
          <span>점수 <b id="final-score">0</b></span>
        </div>
        <button type="button" class="primary" id="retry-btn">다시 사냥</button>
        <a href="/">← 오늘의 게임</a>
      </div>
    </main>

    <script src="/js/bgm.js?v=3"></script>
    <script src="/js/scores.js"></script>
    <script src="/js/game-rank.js"></script>
    <script src="/js/pause.js"></script>
    <script src="game.js?v=5"></script>
  </body>
</html>
