<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffe27a" />
    <title>같은 소리 짝짓기</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Jua&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/edu-play.css" />
    <link rel="stylesheet" href="/css/game-seo.css" />
  </head>
  <body>
    <div class="stage">
      <header class="hud">
        <a class="icon-btn home" href="/" aria-label="홈">🏠</a>
        <p class="progress-pill" id="progress-pill">짝 찾기</p>
        <button type="button" class="icon-btn" id="speak-btn" aria-label="다시 듣기">🔊</button>
      </header>

      <main class="play" id="play">
        <p class="prompt" id="prompt">그림과 글자 짝을 찾아보세요</p>
        <div class="mem-grid" id="board"></div>
      </main>

      <div class="overlay" id="title">
        <p class="badge">교육 · 레벨 2</p>
        <img class="hero" src="/assets/edu/edu_banana.svg" alt="" width="140" height="140" />
        <h1>같은 소리 짝짓기</h1>
        <p class="lead">카드를 뒤집고<br />그림과 글자를 짝지어요</p>
        <button type="button" class="icon-play" id="start-btn" aria-label="시작">▶</button>
        <a class="home-link" href="/">🏠</a>
      </div>

      <div class="overlay hidden" id="done">
        <p class="badge soft">잘했어요</p>
        <img class="hero small" src="/assets/edu/edu_chick.svg" alt="" width="110" height="110" />
        <h2>오늘 배운 것</h2>
        <p class="learned" id="learned">사과</p>
        <p class="parent-note">부모님께: 그림과 낱말을 짝지어 어휘와 소리를 익히는 놀이예요.</p>
        <div class="done-actions">
          <button type="button" class="icon-play" id="again-btn" aria-label="다시하기">↻</button>
          <a class="icon-btn lg" href="/" aria-label="홈">🏠</a>
        </div>
      </div>
    </div>

    <script src="/js/edu-progress.js?v=3"></script>
    <script src="/js/edu-speech.js?v=8"></script>
    <script src="/js/edu-words.js?v=1"></script>
    <script src="game.js?v=1"></script>
    <!-- seo:game:start -->
<section class="seo-about" aria-label="같은 소리 짝짓기 소개">
  <h2>같은 소리 짝짓기 소개</h2>
  <p>그림 카드와 낱말 카드를 뒤집어 같은 짝을 찾는 한글 어휘 게임입니다.</p>
  <h3>플레이 방법</h3>
  <p>카드를 두 장씩 뒤집어 그림과 글자가 같은 낱말이면 짝이 맞습니다. 모든 짝을 찾으면 끝이 납니다.</p>
  <h3>자주 묻는 질문</h3>
  <dl>
    <dt>몇 쌍을 찾나요?</dt>
    <dd>한 판에 여섯 쌍을 찾습니다.</dd>
  </dl>
</section>
<!-- seo:game:end -->
  </body>
</html>
