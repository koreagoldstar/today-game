<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffe27a" />
    <title>낱말 완성 퍼즐</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/edu-play.css?v=8" />
    <link rel="stylesheet" href="/css/game-seo.css?v=3" />
    <link rel="stylesheet" href="/css/game-chrome.css?v=4" />
  </head>
  <body class="edu-play">
    <div class="stage">
      <header class="hud">
        <a class="icon-btn home" href="/" aria-label="홈">🏠</a>
        <p class="progress-pill" id="progress-pill">1 / 5</p>
        <button type="button" class="icon-btn" id="speak-btn" aria-label="다시 듣기">🔊</button>
      </header>

      <main class="play" id="play">
        <img class="picture" id="picture" alt="" width="120" height="120" />
        <div class="blank-word" id="blank"></div>
        <div class="choices letters" id="choices"></div>
      </main>

      <div class="overlay" id="title">
        <p class="badge">교육 · 레벨 3</p>
        <img class="hero" src="/assets/edu/edu_banana.svg" alt="" width="140" height="140" />
        <h1>낱말 완성 퍼즐</h1>
        <p class="lead">빈칸에 들어갈<br />소리를 찾아요</p>
        <button type="button" class="icon-play" id="start-btn" aria-label="시작">▶</button>
        <a class="home-link" href="/">🏠</a>
      </div>

      <div class="overlay hidden" id="done">
        <p class="badge soft">잘했어요</p>
        <img class="hero small" src="/assets/edu/edu_chick.svg" alt="" width="110" height="110" />
        <h2>오늘 배운 것</h2>
        <p class="learned" id="learned">바나나</p>
        <p class="parent-note">부모님께: 그림과 빈칸으로 낱말을 맞추는 초기 읽기 놀이예요.</p>
        <div class="done-actions">
          <button type="button" class="icon-play" id="again-btn" aria-label="다시하기">↻</button>
          <a class="icon-btn lg" href="/" aria-label="홈">🏠</a>
        </div>
      </div>
    </div>

    <script src="/js/today-audio.js?v=2"></script>
    <script src="/js/game-chrome.js?v=3"></script>
    <script src="/js/edu-progress.js?v=5"></script>
    <script src="/js/edu-speech.js?v=10"></script>
    <script src="/js/edu-words.js?v=3"></script>
    <script src="game.js?v=1"></script>
    <!-- seo:game:start -->
<section class="seo-about" aria-label="낱말 완성 퍼즐 소개">
  <h2>낱말 완성 퍼즐 소개</h2>
  <p>그림과 빈칸 낱말을 보고 빠진 소리를 고르는 초기 읽기 퍼즐입니다.</p>
  <h3>플레이 방법</h3>
  <p>그림과 바_나처럼 빈칸 있는 낱말을 보고, 보기 음절 세 개 중 알맞은 것을 탭하세요.</p>
  <h3>자주 묻는 질문</h3>
  <dl>
    <dt>힌트가 있나요?</dt>
    <dd>그림이 먼저 보이니 소리만 떠올려도 고를 수 있습니다.</dd>
  </dl>
</section>
<!-- seo:game:end -->
      <script src="/js/game-seo.js?v=1"></script>
  </body>
</html>
