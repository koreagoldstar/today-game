<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <defs>
    <radialGradient id="spaceBg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#162238" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#050811" />
    </radialGradient>

    <radialGradient id="nebula" cx="70%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#7209b7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#050811" stop-opacity="0" />
    </radialGradient>
    
    <radialGradient id="cyanGlow" cx="30%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#050811" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="shipBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f7fa" />
      <stop offset="40%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#03045e" />
    </linearGradient>

    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>

    <linearGradient id="thrusterFlame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#ffd166" />
      <stop offset="70%" stop-color="#ff0055" />
      <stop offset="100%" stop-color="#7209b7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="meteorFlame" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="50%" stop-color="#ff0055" />
      <stop offset="100%" stop-color="#3a0ca3" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="rockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4a261" />
      <stop offset="50%" stop-color="#e07a5f" />
      <stop offset="100%" stop-color="#2b1e1a" />
    </linearGradient>

    <radialGradient id="shieldGrad" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="90%" stop-color="#00f0ff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9" />
    </radialGradient>

    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="220" height="220" rx="44" fill="url(#spaceBg)" />
  <rect width="220" height="220" rx="44" fill="url(#nebula)" />
  <rect width="220" height="220" rx="44" fill="url(#cyanGlow)" />

  <circle cx="30" cy="40" r="1.5" fill="#fff" opacity="0.9" />
  <circle cx="85" cy="25" r="2.2" fill="#ffd166" filter="url(#glowFilter)" />
  <circle cx="190" cy="35" r="1.8" fill="#fff" opacity="0.7" />
  <circle cx="175" cy="185" r="2.5" fill="#00f0ff" filter="url(#glowFilter)" />
  <circle cx="35" cy="170" r="1.2" fill="#fff" opacity="0.8" />
  <circle cx="110" cy="195" r="1.6" fill="#fff" opacity="0.6" />

  <line x1="20" y1="10" x2="20" y2="40" stroke="#ffffff" opacity="0.15" stroke-width="1" stroke-dasharray="4 8" />
  <line x1="200" y1="60" x2="200" y2="110" stroke="#00f0ff" opacity="0.2" stroke-width="1.5" />
  <line x1="160" y1="140" x2="160" y2="190" stroke="#ffffff" opacity="0.15" stroke-width="1" />

  <g transform="translate(155, 65) rotate(-35)">
    <path d="M-35,-15 C-60,-5 -80,25 -105,30 C-65,38 -45,65 0,50 C40,35 30,-25 -35,-15 Z" fill="url(#meteorFlame)" opacity="0.85" filter="url(#glowFilter)" />
    <path d="M12,-15 L28,-2 L32,18 L16,32 L-8,30 L-22,14 L-15,-8 Z" fill="url(#rockGrad)" stroke="#ffb703" stroke-width="2" stroke-linejoin="round" filter="url(#glowFilter)" />
    <circle cx="5" cy="5" r="5" fill="#1e100c" opacity="0.6" />
    <circle cx="18" cy="12" r="3" fill="#1e100c" opacity="0.5" />
    <circle cx="-5" cy="16" r="3.5" fill="#1e100c" opacity="0.6" />
  </g>

  <g transform="translate(95, 125)">
    <polygon points="-7,30 0,68 7,30" fill="url(#thrusterFlame)" filter="url(#strongGlow)" />
    <polygon points="-3,28 0,50 3,28" fill="#ffffff" filter="url(#glowFilter)" />

    <circle cx="0" cy="0" r="44" fill="url(#shieldGrad)" filter="url(#glowFilter)" opacity="0.85" />
    <circle cx="0" cy="0" r="44" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="6 4" fill="none" filter="url(#glowFilter)" />

    <g filter="url(#glowFilter)">
      <path d="M0,-36 L-44,20 L-24,24 L0,14 Z" fill="url(#wingGrad)" />
      <path d="M0,-36 L44,20 L24,24 L0,14 Z" fill="url(#wingGrad)" />

      <path d="M0,-42 L-16,-5 L-10,22 L0,28 L10,22 L16,-5 Z" fill="url(#shipBody)" stroke="#ffffff" stroke-width="1.2" />

      <ellipse cx="0" cy="-10" rx="6" ry="15" fill="#ffffff" opacity="0.95" />
      <ellipse cx="0" cy="-10" rx="4" ry="11" fill="#00f0ff" opacity="0.8" />

      <circle cx="-42" cy="18" r="3.5" fill="#ff0055" filter="url(#glowFilter)" />
      <circle cx="42" cy="18" r="3.5" fill="#00f0ff" filter="url(#glowFilter)" />
    </g>
  </g>

  <g transform="translate(48, 75)" filter="url(#strongGlow)">
    <polygon points="0,-16 4.5,-4.5 16,0 4.5,4.5 0,16 -4.5,4.5 -16,0 -4.5,-4.5" fill="#ffd166" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="0" cy="0" r="4" fill="#ffffff" />
  </g>
</svg>
