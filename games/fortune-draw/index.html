<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffd4e4" />
    <title>오늘의 운세 뽑기</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Jua&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css?v=4" />
    <link rel="stylesheet" href="/css/game-seo.css?v=3" />
    <link rel="stylesheet" href="/css/game-chrome.css?v=2" />
  </head>
  <body data-bgm="fortune-draw">
    <div class="stage">
      <header class="hud">
        <a class="home" href="/">← 홈</a>
        <p class="pill">하루 한 번</p>
      </header>
      <main class="play">
        <h1 id="page-title">오늘의 운세</h1>
        <p class="lead">알을 톡 누르면 삐약이가 알려줘요</p>
        <div class="tabs">
          <button type="button" class="tab active" data-cat="fortune">운세</button>
          <button type="button" class="tab" data-cat="lunch">점심</button>
          <button type="button" class="tab" data-cat="item">행운템</button>
        </div>

        <div class="draw" id="draw">
          <button type="button" class="egg" id="egg" aria-label="알 깨기">
            <svg viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg">
              <ellipse cx="100" cy="200" rx="48" ry="10" fill="#e8c48a" opacity="0.45"/>
              <path d="M100 18 C142 18 168 78 168 128 C168 176 138 198 100 198 C62 198 32 176 32 128 C32 78 58 18 100 18 Z" fill="#fff6d8" stroke="#4a3728" stroke-width="5"/>
              <path d="M58 92 C78 70 122 66 148 96" fill="none" stroke="#ffe27a" stroke-width="10" stroke-linecap="round" opacity="0.7"/>
              <circle cx="78" cy="108" r="7" fill="#fff" opacity="0.7"/>
              <ellipse cx="100" cy="132" rx="28" ry="22" fill="#ffe27a" stroke="#4a3728" stroke-width="3"/>
              <circle cx="90" cy="128" r="4" fill="#4a3728"/>
              <circle cx="110" cy="128" r="4" fill="#4a3728"/>
              <path d="M92 140 Q100 146 108 140" stroke="#4a3728" stroke-width="3" fill="none" stroke-linecap="round"/>
              <path d="M86 118 L78 108 M114 118 L122 108" stroke="#4a3728" stroke-width="3" stroke-linecap="round"/>
            </svg>
          </button>
          <p class="hint" id="hint">알을 눌러 오늘의 운세를 봐요</p>
        </div>

        <div class="result" id="result">
          <img class="hero" src="assets/thumb.png" alt="" width="96" height="96" />
          <p class="emoji" id="r-emoji">🌟</p>
          <h2 class="title" id="r-title"></h2>
          <p class="desc" id="r-desc"></p>
          <div class="row">
            <button type="button" class="btn kakao" id="share-btn">카카오톡 공유</button>
            <button type="button" class="btn soft" id="next-btn">다른 항목</button>
          </div>
          <a class="link" href="/">← 오늘의 게임</a>
        </div>
        <p class="timer" id="timer"></p>
      </main>
    </div>

    <script src="/js/today-audio.js?v=2"></script>
    <script src="/js/game-chrome.js?v=2"></script>
    <script src="/js/bgm.js?v=6"></script>
    <script src="/js/scores.js?v=7"></script>
    <script src="/js/retention.js"></script>
    <script src="/js/pause.js?v=3"></script>
    <script src="game.js?v=2"></script>
    <!-- seo:game:start -->
<section class="seo-about" aria-label="오늘의 운세 뽑기 소개">
  <h2>오늘의 운세 뽑기 소개</h2>
  <p>알을 톡 눌러 오늘의 운세, 점심 메뉴, 행운 아이템을 뽑는 귀여운 하루 한 번 놀이입니다.</p>
  <h3>플레이 방법</h3>
  <p>세 탭 중 하나를 고른 뒤 알을 누르세요. 항목마다 하루에 한 번씩 결과가 정해집니다.</p>
  <h3>자주 묻는 질문</h3>
  <dl>
    <dt>다시 뽑을 수 있나요?</dt>
    <dd>같은 항목은 다음 날까지 기다려야 합니다. 다른 탭은 아직 안 뽑았다면 바로 할 수 있습니다.</dd>
  </dl>
</section>
<!-- seo:game:end -->
    <script src="/js/game-seo.js?v=1"></script>
  </body>
</html>
