<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#7ec8ff" />
    <title>오프라인 · 오늘의 게임</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #17324d;
        text-align: center;
        font-family: system-ui, sans-serif;
        background: linear-gradient(160deg, #dff3ff, #fff5c7);
      }
      main {
        width: min(100%, 420px);
        padding: 34px 24px;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.88);
        box-shadow: 0 18px 45px rgba(42, 112, 160, 0.18);
      }
      img { width: 112px; height: 112px; border-radius: 28px; }
      h1 { margin: 18px 0 8px; font-size: 1.7rem; }
      p { margin: 0 0 22px; line-height: 1.6; }
      button {
        min-height: 44px;
        padding: 0 22px;
        border: 0;
        border-radius: 999px;
        color: #fff;
        font-weight: 800;
        background: #3a8fd4;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/assets/pwa-icon-192.png" alt="" width="112" height="112" />
      <h1>인터넷 연결이 필요해요</h1>
      <p>연결을 확인한 뒤 다시 시도해 주세요.<br />전에 열었던 게임은 오프라인에서도 열릴 수 있어요.</p>
      <button type="button" onclick="location.reload()">다시 연결하기</button>
    </main>
  </body>
</html>
