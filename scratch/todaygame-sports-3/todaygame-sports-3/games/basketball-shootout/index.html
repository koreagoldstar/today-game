<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>농구 슈팅 챌린지 | 오늘의게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Orbitron:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --court1:#F2A65A; --court2:#E08E3E; --line:#FFFFFF;
    --sky1:#FFE9C7; --ink:#2A2018; --ink-soft:#8A7864;
    --red:#FF5C5C; --gold:#FFC145; --card:#FFFFFF;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--sky1); color:var(--ink);
    font-family:'Gowun Dodum', sans-serif; overflow:hidden; touch-action:none;
    display:flex; align-items:center; justify-content:center; min-height:100vh;
  }
  .wrap{ width:100%; max-width:480px; height:100vh; max-height:900px; position:relative; }
  canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }

  .brand{ position:absolute; top:10px; left:0; right:0; text-align:center; font-size:11px; color:rgba(42,32,24,.55); z-index:3; }
  .hud{ position:absolute; top:30px; left:14px; right:14px; display:flex; justify-content:space-between; z-index:3; pointer-events:none; }
  .hud .box{ background:rgba(255,255,255,.88); border-radius:14px; padding:8px 14px; font-family:'Jua',sans-serif; }
  .hud .score{ color:var(--red); font-size:18px; }
  .hud .timer{ color:var(--ink); font-size:18px; font-family:'Orbitron',sans-serif; font-weight:800; }
  .hud .streak{ color:var(--gold-dark, #B8791A); font-size:12px; text-align:right; }

  .popup{ position:absolute; left:50%; transform:translate(-50%,0); font-family:'Jua',sans-serif; font-size:22px; opacity:0; pointer-events:none; z-index:4; }
  .popup.show{ animation:popUp .7s ease forwards; }
  @keyframes popUp{
    0%{opacity:0; transform:translate(-50%,0) scale(.7);}
    25%{opacity:1; transform:translate(-50%,-16px) scale(1.08);}
    100%{opacity:0; transform:translate(-50%,-40px) scale(1);}
  }

  .overlay{ position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; background:rgba(30,22,14,.82); text-align:center; padding:24px; z-index:6; }
  .overlay.show{ display:flex; }
  .overlay h1{ font-family:'Jua',sans-serif; font-size:26px; margin:0 0 6px; color:#fff; }
  .overlay p{ color:#F0E2D0; font-size:13.5px; margin:0 0 20px; }
  .big-emoji{ font-size:56px; margin-bottom:10px; }
  .btn{ padding:14px 26px; border-radius:16px; border:none; cursor:pointer; font-family:'Jua',sans-serif; font-size:14.5px; background:var(--gold); color:#4A3300; margin:4px; }
  .btn.secondary{ background:rgba(255,255,255,.15); color:#fff; border:1px solid rgba(255,255,255,.3); }
  .statline{ font-family:'Orbitron',sans-serif; font-size:15px; color:var(--gold); margin-bottom:4px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="brand">🐣 오늘의게임 · 농구 슈팅 챌린지</div>
  <canvas id="c"></canvas>

  <div class="hud">
    <div class="box score" id="scoreBox">SCORE 0</div>
    <div class="box timer" id="timerBox">60</div>
    <div class="box streak" id="streakBox">STREAK 0</div>
  </div>

  <div class="popup" id="popup"></div>

  <div class="overlay show" id="startOverlay">
    <div class="big-emoji">🐣🏀</div>
    <h1>농구 슈팅 챌린지</h1>
    <p>공을 드래그해서 당긴 뒤 놓으면 슛!<br>60초 동안 최대한 많이 넣어보세요.</p>
    <button class="btn" id="startBtn">챌린지 시작</button>
  </div>

  <div class="overlay" id="endOverlay">
    <div class="big-emoji">🏆</div>
    <h1>타임 업!</h1>
    <div class="statline" id="endScore">SCORE 0</div>
    <div class="statline" id="endMade">성공 0 / 시도 0</div>
    <div class="statline" id="endBest">BEST 0</div>
    <div>
      <button class="btn" id="retryBtn">다시 도전</button>
      <button class="btn secondary" id="shareBtn2">결과 공유</button>
    </div>
  </div>
</div>

<script>
(function(){
  const wrap = document.getElementById('wrap');
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W,H,DPR;
  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2);
    W = wrap.clientWidth; H = wrap.clientHeight;
    canvas.width = W*DPR; canvas.height = H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    layout();
  }

  let audioCtx=null;
  function ensureAudio(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); }
  function sfx(freq,dur,type,gain){
    if(!audioCtx) return;
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type||'square'; o.frequency.value=freq; g.gain.value=gain||0.06;
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+dur);
    o.stop(audioCtx.currentTime+dur+0.02);
  }
  function swishSfx(){ sfx(1200,0.12,'sine',0.08); setTimeout(()=>sfx(1500,0.1,'sine',0.06),60); }
  function missSfx(){ sfx(150,0.15,'sawtooth',0.05); }

  const STORAGE_BEST = 'tg_basketball_best';
  let best = parseInt(localStorage.getItem(STORAGE_BEST)||'0',10);

  const GRAVITY = 1600; // px/s^2
  let hoop = {}; // layout-dependent
  let ballStart = {};
  let ball = { x:0, y:0, vx:0, vy:0, flying:false, touchedRim:false, trail:[] };
  let score = 0, made = 0, attempts = 0, streak = 0;
  let timeLeft = 60;
  let running = false;
  let timerInterval = null;
  let dragging = false, dragStart = {x:0,y:0}, dragCur = {x:0,y:0};

  function layout(){
    hoop = {
      cx: W*0.5, cy: H*0.24,
      rimW: W*0.30, rimH: H*0.018,
      backboardW: W*0.36, backboardH: H*0.11,
    };
    ballStart = { x: W*0.5, y: H*0.74, r: W*0.075 };
    resetBallToStart();
  }

  function resetBallToStart(){
    ball.x = ballStart.x; ball.y = ballStart.y;
    ball.vx = 0; ball.vy = 0; ball.flying = false; ball.touchedRim = false;
    ball.trail = [];
  }

  function updateHUD(){
    document.getElementById('scoreBox').textContent = 'SCORE ' + score;
    document.getElementById('timerBox').textContent = timeLeft;
    document.getElementById('streakBox').textContent = 'STREAK ' + streak;
  }

  function popup(text, color, x, y){
    const p = document.getElementById('popup');
    p.textContent = text;
    p.style.color = color;
    p.style.top = y + 'px';
    p.style.left = x + 'px';
    p.classList.remove('show'); void p.offsetWidth; p.classList.add('show');
  }

  function startGame(){
    score=0; made=0; attempts=0; streak=0; timeLeft=60;
    resetBallToStart();
    running = true;
    updateHUD();
    clearInterval(timerInterval);
    timerInterval = setInterval(()=>{
      timeLeft--;
      updateHUD();
      if(timeLeft<=0){ endGame(); }
    }, 1000);
  }

  function endGame(){
    running = false;
    clearInterval(timerInterval);
    if(score > best){ best = score; localStorage.setItem(STORAGE_BEST, String(best)); }
    document.getElementById('endScore').textContent = 'SCORE ' + score;
    document.getElementById('endMade').textContent = `성공 ${made} / 시도 ${attempts}`;
    document.getElementById('endBest').textContent = 'BEST ' + best;
    document.getElementById('endOverlay').classList.add('show');
  }

  function launchBall(vx, vy){
    ball.flying = true;
    ball.touchedRim = false;
    ball.vx = vx; ball.vy = vy;
    attempts++;
  }

  function checkScoreAndCollide(dt){
    // rim collision (simple annulus bounce)
    const dxRim = ball.x - hoop.cx;
    const rimTopY = hoop.cy;
    if(Math.abs(ball.y - rimTopY) < 10 && Math.abs(dxRim) > hoop.rimW*0.34 && Math.abs(dxRim) < hoop.rimW*0.52 && ball.vy > 0){
      ball.vx *= -0.5;
      ball.vy *= -0.35;
      ball.touchedRim = true;
    }
    // backboard collision
    const bbLeft = hoop.cx - hoop.backboardW/2, bbRight = hoop.cx + hoop.backboardW/2;
    const bbY = hoop.cy - hoop.backboardH*0.7;
    if(ball.y < hoop.cy && ball.y > bbY && ball.x > bbLeft && ball.x < bbRight && ball.vy < 0 && Math.abs(ball.x-hoop.cx) < hoop.backboardW*0.5){
      // hitting board from below/side roughly - treat top area as backboard front
    }
    // score check: crossing rim center band moving downward within rim width
    if(!ball.scored && ball.vy > 0 && Math.abs(ball.y - hoop.cy) < 8 && Math.abs(dxRim) < hoop.rimW*0.30){
      ball.scored = true;
      const swish = !ball.touchedRim;
      made++;
      streak++;
      const pts = 2 + (swish?1:0);
      score += pts;
      popup(swish ? 'SWISH! +3' : 'GOAL! +2', swish?'#FFC145':'#5FBE72', hoop.cx, hoop.cy+20);
      swishSfx();
      updateHUD();
    }
    // out of bounds / floor -> reset
    if(ball.y > H+40 || ball.x < -40 || ball.x > W+40){
      if(!ball.scored){
        streak = 0;
        popup('MISS', '#FF5C5C', ball.x, H*0.5);
        missSfx();
        updateHUD();
      }
      resetBallToStart();
    }
  }

  function physicsStep(dt){
    if(!ball.flying) return;
    ball.trail.push({x:ball.x, y:ball.y});
    if(ball.trail.length > 14) ball.trail.shift();
    ball.vy += GRAVITY*dt;
    ball.x += ball.vx*dt;
    ball.y += ball.vy*dt;
    checkScoreAndCollide(dt);
  }

  // input
  function getPos(e){
    const rect = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: p.clientX-rect.left, y: p.clientY-rect.top };
  }
  function onDown(e){
    if(!running || ball.flying) return;
    const pos = getPos(e);
    const dist = Math.hypot(pos.x-ball.x, pos.y-ball.y);
    if(dist < ballStart.r*2.2){
      dragging = true;
      dragStart = {x:ball.x, y:ball.y};
      dragCur = pos;
      ensureAudio();
    }
    e.preventDefault();
  }
  function onMove(e){
    if(!dragging) return;
    dragCur = getPos(e);
    e.preventDefault();
  }
  function onUp(e){
    if(!dragging) return;
    dragging = false;
    const dx = dragStart.x - dragCur.x;
    const dy = dragStart.y - dragCur.y;
    const dist = Math.hypot(dx,dy);
    if(dist < 10){ return; }
    const power = Math.min(dist, W*0.55);
    const sensitivity = 3.1;
    const vx = (dx/dist) * power * sensitivity * 0.55;
    const vy = (dy/dist) * power * sensitivity;
    ball.scored = false;
    launchBall(vx, -Math.abs(vy));
  }

  canvas.addEventListener('touchstart', onDown, {passive:false});
  canvas.addEventListener('touchmove', onMove, {passive:false});
  canvas.addEventListener('touchend', onUp);
  canvas.addEventListener('mousedown', onDown);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);

  function drawCourt(){
    ctx.clearRect(0,0,W,H);
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#F2A65A'); g.addColorStop(1,'#D9843A');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

    // key/lane lines
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 3;
    ctx.strokeRect(W*0.28, hoop.cy-6, W*0.44, H*0.5);
    ctx.beginPath();
    ctx.arc(W*0.5, hoop.cy + H*0.5 - 6, W*0.22, 0, Math.PI*2);
    ctx.stroke();

    // backboard
    ctx.fillStyle = '#F5F5F5';
    ctx.fillRect(hoop.cx-hoop.backboardW/2, hoop.cy-hoop.backboardH, hoop.backboardW, hoop.backboardH*0.65);
    ctx.strokeStyle = '#FF5C5C'; ctx.lineWidth = 3;
    ctx.strokeRect(hoop.cx-hoop.backboardW*0.22, hoop.cy-hoop.backboardH*0.55, hoop.backboardW*0.44, hoop.backboardH*0.32);

    // rim
    ctx.strokeStyle = '#FF5C5C'; ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.ellipse(hoop.cx, hoop.cy, hoop.rimW/2, hoop.rimH*2.2, 0, 0, Math.PI*2);
    ctx.stroke();
    // net
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 1.5;
    for(let i=-4;i<=4;i++){
      ctx.beginPath();
      ctx.moveTo(hoop.cx + i*(hoop.rimW/10), hoop.cy);
      ctx.lineTo(hoop.cx + i*(hoop.rimW/22), hoop.cy + hoop.backboardH*0.55);
      ctx.stroke();
    }

    // trail
    ball.trail.forEach((t,i)=>{
      ctx.globalAlpha = (i/ball.trail.length)*0.4;
      ctx.beginPath();
      ctx.fillStyle = '#FF8A3D';
      ctx.arc(t.x, t.y, ballStart.r*0.5, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;

    // aim line while dragging
    if(dragging){
      const dx = dragStart.x - dragCur.x, dy = dragStart.y - dragCur.y;
      ctx.strokeStyle = 'rgba(255,255,255,.7)';
      ctx.setLineDash([6,6]);
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(ball.x, ball.y);
      ctx.lineTo(ball.x + dx*1.2, ball.y + dy*1.2);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // ball
    ctx.beginPath();
    ctx.fillStyle = '#E8722C';
    ctx.arc(ball.x, ball.y, ballStart.r, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#8B4413'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(ball.x-ballStart.r, ball.y); ctx.lineTo(ball.x+ballStart.r, ball.y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ball.x, ball.y-ballStart.r); ctx.lineTo(ball.x, ball.y+ballStart.r); ctx.stroke();

    // stand emoji
    ctx.font = '26px sans-serif';
    ctx.textAlign='center';
    ctx.fillText('🐣', ballStart.x, ballStart.y + ballStart.r + 26);
  }

  let lastT = 0;
  function frame(ts){
    if(!lastT) lastT = ts;
    const dt = Math.min(0.032, (ts-lastT)/1000);
    lastT = ts;
    physicsStep(dt);
    drawCourt();
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);

  document.getElementById('startBtn').addEventListener('click', ()=>{
    ensureAudio();
    document.getElementById('startOverlay').classList.remove('show');
    startGame();
  });
  document.getElementById('retryBtn').addEventListener('click', ()=>{
    document.getElementById('endOverlay').classList.remove('show');
    startGame();
  });
  document.getElementById('shareBtn2').addEventListener('click', ()=>{
    const text = `농구 슈팅 챌린지 결과: SCORE ${score} (성공 ${made}/${attempts}) 🏀\\ntodaygame.co.kr 에서 도전해보세요!`;
    if(navigator.share){ navigator.share({text}).catch(()=>{}); }
    else if(navigator.clipboard){
      navigator.clipboard.writeText(text);
      const b = document.getElementById('shareBtn2');
      const o=b.textContent; b.textContent='복사됐어요!';
      setTimeout(()=> b.textContent=o, 1400);
    }
  });

  updateHUD();
})();
</script>
</body>
</html>
