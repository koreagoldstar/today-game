<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>볼링 스트라이크 | 오늘의게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Orbitron:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --lane1:#E8C48A; --lane2:#D9A85E; --gutter:#7A5230;
    --ink:#2A2018; --ink-soft:#8A7864; --card:#FFFFFF;
    --red:#FF5C5C; --gold:#FFC145; --sky:#CFE8FF;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--sky); color:var(--ink);
    font-family:'Gowun Dodum', sans-serif; overflow:hidden; touch-action:none;
    display:flex; align-items:center; justify-content:center; min-height:100vh;
  }
  .wrap{ width:100%; max-width:480px; height:100vh; max-height:900px; position:relative; display:flex; flex-direction:column; }
  canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }

  .brand{ position:absolute; top:10px; left:0; right:0; text-align:center; font-size:11px; color:rgba(42,32,24,.55); z-index:3; }
  .hud{ position:absolute; top:30px; left:14px; right:14px; display:flex; justify-content:space-between; z-index:3; pointer-events:none; }
  .hud .box{ background:rgba(255,255,255,.9); border-radius:14px; padding:8px 14px; font-family:'Jua',sans-serif; font-size:13px; }
  .hud .frame{ color:var(--ink); }
  .hud .score{ color:var(--red); font-family:'Orbitron',sans-serif; font-weight:800; font-size:18px; }

  .frameStrip{ position:absolute; top:64px; left:14px; right:14px; display:flex; gap:3px; z-index:3; }
  .fbox{ flex:1; background:rgba(255,255,255,.75); border-radius:6px; font-size:10px; text-align:center; padding:3px 0; color:var(--ink-soft); }
  .fbox.cur{ background:#fff; color:var(--red); font-weight:700; }

  .popup{ position:absolute; left:50%; top:35%; transform:translate(-50%,0); font-family:'Jua',sans-serif; font-size:30px; opacity:0; pointer-events:none; z-index:4; text-shadow:0 3px 0 rgba(0,0,0,.15); }
  .popup.show{ animation:popUp .8s ease forwards; }
  @keyframes popUp{ 0%{opacity:0; transform:translate(-50%,10px) scale(.6);} 25%{opacity:1; transform:translate(-50%,-10px) scale(1.1);} 75%{opacity:1;} 100%{opacity:0; transform:translate(-50%,-22px) scale(1);} }

  .meter-wrap{ position:absolute; left:20px; right:20px; bottom:26px; z-index:3; background:rgba(255,255,255,.92); border-radius:18px; padding:12px 16px 16px; }
  .meter-label{ font-family:'Jua',sans-serif; font-size:13px; color:var(--ink-soft); margin-bottom:6px; text-align:center; }
  .meter-track{ position:relative; height:20px; border-radius:12px; background:#F1E7D5; overflow:hidden; border:1px solid #E4D3B4; }
  .meter-center{ position:absolute; top:0; bottom:0; left:44%; width:12%; background:#FFD98A; }
  .meter-marker{ position:absolute; top:-4px; width:6px; height:28px; background:var(--ink); border-radius:3px; left:0; }
  .tap-hint{ text-align:center; margin-top:10px; font-family:'Jua',sans-serif; font-size:14px; color:var(--red); }

  .overlay{ position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; background:rgba(30,22,14,.82); text-align:center; padding:24px; z-index:6; }
  .overlay.show{ display:flex; }
  .overlay h1{ font-family:'Jua',sans-serif; font-size:26px; margin:0 0 6px; color:#fff; }
  .overlay p{ color:#F0E2D0; font-size:13.5px; margin:0 0 20px; }
  .big-emoji{ font-size:56px; margin-bottom:10px; }
  .btn{ padding:14px 26px; border-radius:16px; border:none; cursor:pointer; font-family:'Jua',sans-serif; font-size:14.5px; background:var(--gold); color:#4A3300; margin:4px; }
  .btn.secondary{ background:rgba(255,255,255,.15); color:#fff; border:1px solid rgba(255,255,255,.3); }
  .statline{ font-family:'Orbitron',sans-serif; font-size:15px; color:var(--gold); margin-bottom:4px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="brand">🐣 오늘의게임 · 볼링 스트라이크</div>
  <canvas id="c"></canvas>

  <div class="hud">
    <div class="box frame" id="frameBox">1 / 10 프레임</div>
    <div class="box score" id="scoreBox">0</div>
  </div>
  <div class="frameStrip" id="frameStrip"></div>

  <div class="popup" id="popup"></div>

  <div class="meter-wrap" id="meterWrap">
    <div class="meter-label" id="meterLabel">탭해서 방향을 정하세요</div>
    <div class="meter-track" id="meterTrack">
      <div class="meter-center"></div>
      <div class="meter-marker" id="meterMarker"></div>
    </div>
    <div class="tap-hint">화면을 탭!</div>
  </div>

  <div class="overlay show" id="startOverlay">
    <div class="big-emoji">🐣🎳</div>
    <h1>볼링 스트라이크</h1>
    <p>1차: 방향을 정하고 탭!<br>2차: 파워를 정하고 탭! 10프레임 도전!</p>
    <button class="btn" id="startBtn">경기 시작</button>
  </div>

  <div class="overlay" id="endOverlay">
    <div class="big-emoji">🏆</div>
    <h1>경기 종료!</h1>
    <div class="statline" id="endScore">TOTAL 0</div>
    <div class="statline" id="endBest">BEST 0</div>
    <div>
      <button class="btn" id="retryBtn">다시 도전</button>
      <button class="btn secondary" id="shareBtn2">결과 공유</button>
    </div>
  </div>
</div>

<script>
(function(){
  const wrap = document.getElementById('wrap');
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W,H,DPR;
  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2);
    W = wrap.clientWidth; H = wrap.clientHeight;
    canvas.width = W*DPR; canvas.height = H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  let audioCtx=null;
  function ensureAudio(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); }
  function sfx(freq,dur,type,gain){
    if(!audioCtx) return;
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type||'square'; o.frequency.value=freq; g.gain.value=gain||0.06;
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+dur);
    o.stop(audioCtx.currentTime+dur+0.02);
  }
  function crashSfx(intensity){
    if(!audioCtx) return;
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='sawtooth'; o.frequency.value=90;
    g.gain.value = 0.05 + intensity*0.08;
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.3);
    o.stop(audioCtx.currentTime+0.32);
  }

  const STORAGE_BEST = 'tg_bowling_best';
  let best = parseInt(localStorage.getItem(STORAGE_BEST)||'0',10);

  const TOTAL_FRAMES = 10;
  let frameIdx = 0, rollInFrame = 0, totalScore = 0;
  let frames = []; // {rolls:[pins,...], isStrike, isSpare, frameScore}
  let pins = [];
  const PIN_ROWS = [1,2,3,4];

  function resetPins(){
    pins = [];
    let idx = 0;
    const baseY = 0.16;
    PIN_ROWS.forEach((count, row)=>{
      const rowY = baseY + row*0.055;
      const spread = row * 0.045;
      for(let i=0;i<count;i++){
        const x = 0.5 - spread/1 + i*(spread*2/(Math.max(count-1,1)) || 0);
        pins.push({ xr: count===1 ? 0.5 : (0.5 - spread + i*(2*spread/(count-1))), yr: rowY, standing:true, id:idx++ });
      }
    });
  }
  resetPins();

  let state = 'aimAngle'; // aimAngle, aimPower, rolling, betweenRoll
  let angleMarker = 0, angleDir = 1;
  let powerMarker = 0, powerDir = 1;
  let lockedAngle = 0.5, lockedPower = 0;
  let meterRAF = null;

  let ball = { xr:0.5, yr:0.94, flying:false };
  let curveAmount = 0;

  function updateHUD(){
    document.getElementById('frameBox').textContent = (frameIdx+1) + ' / ' + TOTAL_FRAMES + ' 프레임';
    document.getElementById('scoreBox').textContent = totalScore;
    renderFrameStrip();
  }

  function renderFrameStrip(){
    const strip = document.getElementById('frameStrip');
    strip.innerHTML = '';
    for(let i=0;i<TOTAL_FRAMES;i++){
      const f = frames[i];
      const b = document.createElement('div');
      b.className = 'fbox' + (i===frameIdx ? ' cur' : '');
      if(f){
        if(f.isStrike) b.textContent = 'X';
        else if(f.isSpare) b.textContent = '/';
        else if(f.rolls.length) b.textContent = f.rolls.reduce((a,c)=>a+c,0);
        else b.textContent = (i+1);
      } else {
        b.textContent = (i+1);
      }
      strip.appendChild(b);
    }
  }

  function popup(text, color){
    const p = document.getElementById('popup');
    p.textContent = text; p.style.color = color;
    p.classList.remove('show'); void p.offsetWidth; p.classList.add('show');
  }

  function startAimAngle(){
    state = 'aimAngle';
    document.getElementById('meterLabel').textContent = '탭해서 방향을 정하세요';
    angleMarker = 0; angleDir = 1;
    animateAngle();
  }
  function animateAngle(){
    const track = document.getElementById('meterTrack');
    const marker = document.getElementById('meterMarker');
    function step(){
      if(state !== 'aimAngle') return;
      angleMarker += angleDir * 0.028;
      if(angleMarker>=1){ angleMarker=1; angleDir=-1; }
      if(angleMarker<=0){ angleMarker=0; angleDir=1; }
      marker.style.left = (angleMarker*track.clientWidth - 3) + 'px';
      meterRAF = requestAnimationFrame(step);
    }
    meterRAF = requestAnimationFrame(step);
  }
  function startAimPower(){
    state = 'aimPower';
    document.getElementById('meterLabel').textContent = '탭해서 파워를 정하세요';
    powerMarker = 0; powerDir = 1;
    animatePower();
  }
  function animatePower(){
    const track = document.getElementById('meterTrack');
    const marker = document.getElementById('meterMarker');
    function step(){
      if(state !== 'aimPower') return;
      powerMarker += powerDir * 0.036;
      if(powerMarker>=1){ powerMarker=1; powerDir=-1; }
      if(powerMarker<=0){ powerMarker=0; powerDir=1; }
      marker.style.left = (powerMarker*track.clientWidth - 3) + 'px';
      meterRAF = requestAnimationFrame(step);
    }
    meterRAF = requestAnimationFrame(step);
  }

  function onTap(){
    if(state === 'aimAngle'){
      cancelAnimationFrame(meterRAF);
      lockedAngle = angleMarker;
      sfx(500,0.06,'square',0.04);
      startAimPower();
    } else if(state === 'aimPower'){
      cancelAnimationFrame(meterRAF);
      lockedPower = powerMarker;
      sfx(700,0.06,'square',0.04);
      launchBall();
    }
  }

  function launchBall(){
    state = 'rolling';
    document.getElementById('meterWrap').style.display = 'none';
    ball.xr = 0.5; ball.yr = 0.94; ball.flying = true;
    curveAmount = (lockedAngle - 0.5) * 0.9; // -0.45..0.45
    ball.t0 = performance.now();
    ball.dur = 950 - lockedPower*250;
  }

  function knockPins(finalXr, power){
    const gutter = finalXr < 0.08 || finalXr > 0.92;
    let knockedCount = 0;
    if(!gutter){
      const radius = 0.09 + power*0.13;
      pins.forEach(p=>{
        if(!p.standing) return;
        const d = Math.abs(p.xr - finalXr) + Math.abs(p.yr - 0.16)*0.15;
        if(Math.abs(p.xr - finalXr) < radius){
          p.standing = false;
          knockedCount++;
        }
      });
      // chain reaction chance for adjacent pins based on power
      if(power > 0.55){
        pins.forEach(p=>{
          if(!p.standing) return;
          if(Math.abs(p.xr - finalXr) < radius + 0.06 && Math.random() < (power-0.5)){
            p.standing = false; knockedCount++;
          }
        });
      }
    }
    return knockedCount;
  }

  function afterRoll(pinsDown){
    const standingCount = pins.filter(p=>p.standing).length;
    if(!frames[frameIdx]) frames[frameIdx] = { rolls:[], isStrike:false, isSpare:false };
    const f = frames[frameIdx];
    f.rolls.push(pinsDown);
    rollInFrame++;

    if(rollInFrame === 1 && standingCount === 0){
      f.isStrike = true;
      totalScore += 10 + 10; // simplified flat strike bonus
      popup('STRIKE!! 🎉', '#FF5C5C');
      crashSfx(1);
      finishFrame();
      return;
    }
    if(rollInFrame === 1){
      popup(pinsDown + ' 핀!', '#FFC145');
      crashSfx(pinsDown/10);
      totalScore += pinsDown;
      updateHUD();
      setTimeout(()=>{ ball.flying=false; ball.xr=0.5; ball.yr=0.94; state='aimAngle'; document.getElementById('meterWrap').style.display='block'; startAimAngle(); }, 700);
      return;
    }
    // second roll
    if(standingCount === 0){
      f.isSpare = true;
      totalScore += 5; // simplified flat spare bonus
      popup('SPARE!! ✨', '#5FBE72');
      crashSfx(1);
    } else {
      popup(pinsDown + ' 핀!', '#FFC145');
      totalScore += pinsDown;
      crashSfx(pinsDown/10);
    }
    finishFrame();
  }

  function finishFrame(){
    updateHUD();
    setTimeout(()=>{
      frameIdx++;
      rollInFrame = 0;
      resetPins();
      ball.flying = false; ball.xr=0.5; ball.yr=0.94;
      if(frameIdx >= TOTAL_FRAMES){
        endGame();
      } else {
        state='aimAngle';
        document.getElementById('meterWrap').style.display='block';
        updateHUD();
        startAimAngle();
      }
    }, 900);
  }

  function endGame(){
    if(totalScore > best){ best = totalScore; localStorage.setItem(STORAGE_BEST, String(best)); }
    document.getElementById('endScore').textContent = 'TOTAL ' + totalScore;
    document.getElementById('endBest').textContent = 'BEST ' + best;
    document.getElementById('endOverlay').classList.add('show');
  }

  canvas.addEventListener('touchstart', (e)=>{ e.preventDefault(); ensureAudio(); onTap(); }, {passive:false});
  canvas.addEventListener('mousedown', ()=>{ ensureAudio(); onTap(); });

  function drawLane(){
    ctx.clearRect(0,0,W,H);
    const laneLeft = W*0.12, laneRight = W*0.88;
    ctx.fillStyle = '#7A5230';
    ctx.fillRect(0,0,W,H);
    const g = ctx.createLinearGradient(0,H*0.9,0,0);
    g.addColorStop(0,'#E8C48A'); g.addColorStop(1,'#D9A85E');
    ctx.fillStyle = g;
    ctx.fillRect(laneLeft, 0, laneRight-laneLeft, H*0.95);

    // lane planks
    ctx.strokeStyle = 'rgba(120,80,40,.15)'; ctx.lineWidth=1;
    for(let x=laneLeft; x<laneRight; x+=(laneRight-laneLeft)/10){
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H*0.95); ctx.stroke();
    }

    // foul line
    ctx.strokeStyle = 'rgba(200,40,40,.6)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(laneLeft, H*0.9); ctx.lineTo(laneRight, H*0.9); ctx.stroke();

    // pins
    pins.forEach(p=>{
      if(!p.standing) return;
      const px = laneLeft + p.xr*(laneRight-laneLeft);
      const py = p.yr*H;
      ctx.beginPath();
      ctx.fillStyle = '#FDFDFD';
      ctx.ellipse(px, py, W*0.018, W*0.028, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.strokeStyle='#FF5C5C'; ctx.lineWidth=2; ctx.stroke();
    });

    // ball
    if(ball.flying){
      const now = performance.now();
      const t = Math.min(1, (now-ball.t0)/ball.dur);
      const curve = Math.sin(t*Math.PI*0.5) * curveAmount;
      ball.xr = 0.5 + curve;
      ball.yr = 0.9 - t*0.74;
      if(t>=1 && !ball.resolved){
        ball.resolved = true;
        const finalXr = ball.xr;
        const knocked = knockPins(finalXr, lockedPower);
        setTimeout(()=>{ afterRoll(knocked); }, 150);
      }
    }
    const bx = laneLeft + ball.xr*(laneRight-laneLeft);
    const by = ball.yr*H;
    ctx.beginPath();
    ctx.fillStyle = '#2A2018';
    ctx.arc(bx, by, W*0.032, 0, Math.PI*2);
    ctx.fill();
  }

  function frame(){
    drawLane();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  document.getElementById('startBtn').addEventListener('click', ()=>{
    ensureAudio();
    document.getElementById('startOverlay').classList.remove('show');
    frameIdx=0; rollInFrame=0; totalScore=0; frames=[];
    resetPins();
    ball.flying=false; ball.resolved=false;
    updateHUD();
    startAimAngle();
  });
  document.getElementById('retryBtn').addEventListener('click', ()=>{
    document.getElementById('endOverlay').classList.remove('show');
    document.getElementById('meterWrap').style.display='block';
    frameIdx=0; rollInFrame=0; totalScore=0; frames=[];
    resetPins();
    ball.flying=false; ball.resolved=false;
    updateHUD();
    startAimAngle();
  });
  document.getElementById('shareBtn2').addEventListener('click', ()=>{
    const text = `볼링 스트라이크 결과: TOTAL ${totalScore} (BEST ${best}) 🎳\\ntodaygame.co.kr 에서 도전해보세요!`;
    if(navigator.share){ navigator.share({text}).catch(()=>{}); }
    else if(navigator.clipboard){
      navigator.clipboard.writeText(text);
      const b = document.getElementById('shareBtn2');
      const o=b.textContent; b.textContent='복사됐어요!';
      setTimeout(()=> b.textContent=o, 1400);
    }
  });

  // patch ball.resolved reset on new roll launch
  const origLaunch = launchBall;
  launchBall = function(){ ball.resolved = false; origLaunch(); };

  updateHUD();
})();
</script>
</body>
</html>
