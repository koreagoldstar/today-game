<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 운세 뽑기 | 오늘의게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFFBF2;
    --sky:#7EC8FF;
    --sky-deep:#4FA8E8;
    --coral:#FF9E85;
    --yolk:#FFCB4C;
    --ink:#2C2A26;
    --ink-soft:#6B6660;
    --card:#FFFFFF;
    --ring:#F0E6D2;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(60% 50% at 85% 0%, #FFF0E4 0%, transparent 60%),
      radial-gradient(50% 40% at 0% 100%, #E8F5FF 0%, transparent 55%),
      var(--cream);
    font-family:'Gowun Dodum', sans-serif;
    color:var(--ink);
    padding:24px 16px;
  }
  .stage{ width:100%; max-width:420px; }
  .brand{
    display:flex; align-items:center; gap:8px;
    justify-content:center; margin-bottom:14px;
    color:var(--ink-soft); font-size:13px;
  }
  .brand b{ color:var(--sky-deep); font-family:'Jua', sans-serif; font-size:15px;}
  .card{
    background:var(--card);
    border-radius:28px;
    padding:26px 22px 24px;
    box-shadow:0 2px 0 var(--ring), 0 18px 40px -20px rgba(79,168,232,.35);
    border:1px solid var(--ring);
  }
  h1{
    font-family:'Jua', sans-serif; font-size:21px;
    margin:0 0 4px; text-align:center;
  }
  .sub{ color:var(--ink-soft); font-size:13.5px; margin:0 0 18px; text-align:center; }

  .tabs{ display:flex; gap:6px; background:#F5F1E7; border-radius:14px; padding:4px; margin-bottom:20px; }
  .tab{
    flex:1; border:none; background:transparent; padding:9px 4px;
    border-radius:11px; font-family:'Gowun Dodum',sans-serif; font-size:13px;
    color:var(--ink-soft); cursor:pointer; transition:all .15s ease;
  }
  .tab.active{ background:#fff; color:var(--sky-deep); font-weight:700; box-shadow:0 2px 6px rgba(0,0,0,.06); }

  .draw-zone{ text-align:center; min-height:230px; display:flex; flex-direction:column; align-items:center; justify-content:center; }

  .egg{
    width:104px; height:124px; margin:0 auto 18px;
    border-radius:52% 52% 48% 48% / 60% 60% 40% 40%;
    background:linear-gradient(160deg, #FFF6E0 0%, var(--yolk) 100%);
    display:flex; align-items:center; justify-content:center;
    font-size:40px; cursor:pointer; user-select:none;
    box-shadow:0 10px 24px -10px rgba(255,180,50,.55);
    transition:transform .18s ease;
  }
  .egg:active{ transform:scale(.94); }
  .egg.shaking{ animation:shake .5s ease; }
  @keyframes shake{
    0%,100%{ transform:rotate(0); }
    20%{ transform:rotate(-8deg); }
    40%{ transform:rotate(7deg); }
    60%{ transform:rotate(-5deg); }
    80%{ transform:rotate(4deg); }
  }
  .hint{ color:var(--ink-soft); font-size:13.5px; }

  .result-wrap{ display:none; text-align:center; }
  .result-wrap.show{ display:block; }
  .result-emoji{ font-size:46px; margin-bottom:10px; }
  .result-title{ font-family:'Jua',sans-serif; font-size:19px; color:var(--sky-deep); margin:0 0 8px; }
  .result-desc{ font-size:14.5px; line-height:1.6; color:var(--ink); margin:0 0 18px; padding:0 6px; }

  .row{ display:flex; gap:10px; }
  .btn{ flex:1; padding:13px; border-radius:16px; border:none; font-family:'Jua',sans-serif; font-size:14px; cursor:pointer; }
  .btn.share{ background:var(--yolk); color:#5C450A; }
  .btn.close{ background:#F3EFE6; color:var(--ink-soft); }
  .btn:active{ transform:scale(.98); }

  .timer{ margin-top:14px; font-size:12px; color:var(--ink-soft); text-align:center; }
</style>
</head>
<body>
<div class="stage">
  <div class="brand">🐣 <b>오늘의게임</b> · 오늘의 운세 뽑기</div>

  <div class="card">
    <h1 id="pageTitle">🔮 오늘의 운세</h1>
    <p class="sub">하루에 한 번, 알을 톡 눌러서 확인해보세요</p>

    <div class="tabs">
      <button class="tab active" data-cat="fortune">오늘의 운세</button>
      <button class="tab" data-cat="lunch">점심 메뉴</button>
      <button class="tab" data-cat="item">행운 아이템</button>
    </div>

    <div class="draw-zone" id="drawZone">
      <div class="egg" id="egg">🥚</div>
      <p class="hint" id="hintText">알을 눌러서 오늘의 운세를 확인해보세요</p>
    </div>

    <div class="result-wrap" id="resultWrap">
      <div class="result-emoji" id="rEmoji"></div>
      <h2 class="result-title" id="rTitle"></h2>
      <p class="result-desc" id="rDesc"></p>
      <div class="row">
        <button class="btn share" id="shareBtn">결과 공유하기</button>
        <button class="btn close" id="closeBtn">다른 항목 보기</button>
      </div>
    </div>

    <p class="timer" id="timerText"></p>
  </div>
</div>

<script>
(function(){
  const CATS = {
    fortune: {
      title: '🔮 오늘의 운세',
      emoji: '🔮',
      pool: [
        {t:'행운이 가득한 날', d:'오늘은 작은 일에도 운이 따라줘요. 평소 미뤄뒀던 일을 시작해보기 좋은 타이밍이에요.'},
        {t:'차분함이 필요한 날', d:'서두르면 실수하기 쉬운 하루예요. 한 템포 쉬어가면 오히려 일이 잘 풀려요.'},
        {t:'인연이 찾아오는 날', d:'우연한 만남이나 연락이 좋은 소식으로 이어질 수 있어요. 주변을 잘 살펴보세요.'},
        {t:'재충전이 필요한 날', d:'무리하지 말고 컨디션 관리에 신경 쓰세요. 일찍 쉬는 것만으로도 내일이 달라져요.'},
        {t:'집중력이 빛나는 날', d:'평소보다 몰입이 잘 되는 하루예요. 중요한 결정이나 공부를 하기 좋은 날이에요.'},
        {t:'뜻밖의 행운이 있는 날', d:'생각지도 못한 곳에서 좋은 일이 생길 수 있어요. 기대하는 마음을 가져보세요.'},
        {t:'배려가 통하는 날', d:'작은 친절이 크게 돌아오는 하루예요. 먼저 다가가면 관계가 더 좋아져요.'},
        {t:'안정이 필요한 날', d:'큰 변화보다는 지금 하던 대로 꾸준히 가는 게 좋은 하루예요.'}
      ]
    },
    lunch: {
      title: '🍚 오늘의 점심 메뉴',
      emoji: '🍜',
      pool: [
        {t:'김치찌개', d:'든든하고 얼큰한 한 그릇이 필요한 날이에요. 밥 한 공기 추가는 선택이 아니라 필수!'},
        {t:'돈까스', d:'바삭한 튀김옷에 소스 듬뿍! 오늘 점심은 확실한 만족감으로 채워보세요.'},
        {t:'비빔밥', d:'가볍지만 든든하게, 여러 재료를 골고루 비벼서 즐기는 하루예요.'},
        {t:'짜장면', d:'고민 없이 즐길 수 있는 국민 메뉴! 곱빼기도 좋은 선택이에요.'},
        {t:'샐러드 볼', d:'속이 편안한 하루를 원한다면 오늘은 가볍게 채소 위주로 가보세요.'},
        {t:'김밥 한 줄', d:'바쁜 하루엔 든든한 김밥 한 줄이면 충분해요. 참치김밥도 추천!'},
        {t:'라멘', d:'진한 국물이 당기는 날이에요. 반숙 계란 토핑 추가 잊지 마세요.'},
        {t:'초밥', d:'오늘은 나에게 작은 사치를 허락해도 좋은 날이에요.'}
      ]
    },
    item: {
      title: '🍀 오늘의 행운 아이템',
      emoji: '🍀',
      pool: [
        {t:'파란색 소품', d:'파란색 물건을 하나 지니고 다니면 오늘 하루 마음이 한결 차분해져요.'},
        {t:'좋아하는 향의 핸드크림', d:'좋은 향이 기분 전환에 큰 도움이 되는 하루예요.'},
        {t:'작은 메모지', d:'문득 떠오르는 아이디어를 놓치지 마세요. 오늘은 기록이 힘이 되는 날이에요.'},
        {t:'귀여운 스티커', d:'작은 즐거움이 하루를 밝혀주는 날이에요. 다이어리에 하나 붙여보세요.'},
        {t:'따뜻한 텀블러', d:'따뜻한 음료 한 잔이 오늘의 컨디션을 지켜줄 거예요.'},
        {t:'이어폰', d:'좋아하는 음악과 함께라면 오늘 하루가 더 가볍게 흘러가요.'},
        {t:'우산', d:'꼭 비가 오지 않더라도, 오늘은 만약을 대비하면 마음이 편해져요.'},
        {t:'동전 하나', d:'주머니 속 동전 하나가 뜻밖의 행운을 불러올 수 있어요.'}
      ]
    }
  };

  const todayKey = (()=>{ const d=new Date(); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; })();

  function seedFromString(str){
    let h = 0;
    for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) | 0; }
    return h;
  }
  function mulberry32(seed){
    return function(){
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function drawForCategory(catKey){
    const cat = CATS[catKey];
    const seed = seedFromString(todayKey + '_' + catKey);
    const rand = mulberry32(seed);
    const idx = Math.floor(rand() * cat.pool.length);
    return cat.pool[idx];
  }

  function storageKey(catKey){ return `tg_fortune_${catKey}_${todayKey}`; }

  let currentCat = 'fortune';

  const pageTitle = document.getElementById('pageTitle');
  const drawZone = document.getElementById('drawZone');
  const resultWrap = document.getElementById('resultWrap');
  const egg = document.getElementById('egg');
  const hintText = document.getElementById('hintText');
  const tabs = document.querySelectorAll('.tab');

  function nextResetTime(){
    const now = new Date();
    const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate()+1);
    const diff = tomorrow - now;
    const h = Math.floor(diff/3600000);
    const m = Math.floor((diff%3600000)/60000);
    return `${h}시간 ${m}분`;
  }

  function renderResult(catKey, item){
    const cat = CATS[catKey];
    document.getElementById('rEmoji').textContent = cat.emoji;
    document.getElementById('rTitle').textContent = item.t;
    document.getElementById('rDesc').textContent = item.d;
    drawZone.style.display = 'none';
    resultWrap.classList.add('show');
    document.getElementById('timerText').textContent = `⏰ 다음 ${cat.title.replace(/^[^ ]+ /,'')}는 ${nextResetTime()} 후 열려요`;
  }

  function renderDraw(catKey){
    resultWrap.classList.remove('show');
    drawZone.style.display = 'flex';
    document.getElementById('timerText').textContent = '';
    const cat = CATS[catKey];
    hintText.textContent = `알을 눌러서 ${cat.title.replace(/^[^ ]+ /,'')}를 확인해보세요`;
  }

  function switchTab(catKey){
    currentCat = catKey;
    tabs.forEach(t=> t.classList.toggle('active', t.dataset.cat === catKey));
    pageTitle.textContent = CATS[catKey].title;

    const saved = localStorage.getItem(storageKey(catKey));
    if(saved){
      renderResult(catKey, JSON.parse(saved));
    } else {
      renderDraw(catKey);
    }
  }

  egg.addEventListener('click', ()=>{
    if(egg.classList.contains('shaking')) return;
    egg.classList.add('shaking');
    setTimeout(()=>{
      egg.classList.remove('shaking');
      const item = drawForCategory(currentCat);
      localStorage.setItem(storageKey(currentCat), JSON.stringify(item));
      renderResult(currentCat, item);
    }, 500);
  });

  tabs.forEach(t=>{
    t.addEventListener('click', ()=> switchTab(t.dataset.cat));
  });

  document.getElementById('closeBtn').addEventListener('click', ()=>{
    // just re-show current draw zone view isn't allowed once drawn (locked per day) — nudge to switch tab
    const idx = Object.keys(CATS).indexOf(currentCat);
    const keys = Object.keys(CATS);
    const nextKey = keys[(idx+1) % keys.length];
    switchTab(nextKey);
  });

  document.getElementById('shareBtn').addEventListener('click', ()=>{
    const title = document.getElementById('rTitle').textContent;
    const desc = document.getElementById('rDesc').textContent;
    const text = `${pageTitle.textContent} 결과: ${title}\\n${desc}\\ntodaygame.co.kr 에서 확인해보세요!`;
    if(navigator.share){
      navigator.share({ text }).catch(()=>{});
    } else if(navigator.clipboard){
      navigator.clipboard.writeText(text);
      const btn = document.getElementById('shareBtn');
      const orig = btn.textContent;
      btn.textContent = '복사됐어요!';
      setTimeout(()=> btn.textContent = orig, 1500);
    }
  });

  switchTab('fortune');
})();
</script>
</body>
</html>
