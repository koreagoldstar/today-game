<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 상식퀴즈 | 오늘의게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFFBF2;
    --sky:#7EC8FF;
    --sky-deep:#4FA8E8;
    --coral:#FF9E85;
    --yolk:#FFCB4C;
    --ink:#2C2A26;
    --ink-soft:#6B6660;
    --ok:#5FBE8A;
    --bad:#FF7A6E;
    --card:#FFFFFF;
    --ring:#F0E6D2;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(60% 50% at 15% 0%, #E8F5FF 0%, transparent 60%),
      radial-gradient(50% 40% at 100% 100%, #FFF0E4 0%, transparent 55%),
      var(--cream);
    font-family:'Gowun Dodum', sans-serif;
    color:var(--ink);
    padding:24px 16px;
  }
  .stage{ width:100%; max-width:420px; }
  .brand{
    display:flex; align-items:center; gap:8px;
    justify-content:center; margin-bottom:14px;
    color:var(--ink-soft); font-size:13px; letter-spacing:.02em;
  }
  .brand b{ color:var(--sky-deep); font-family:'Jua', sans-serif; font-size:15px;}
  .card{
    background:var(--card);
    border-radius:28px;
    padding:28px 24px 24px;
    box-shadow:0 2px 0 var(--ring), 0 18px 40px -20px rgba(79,168,232,.35);
    border:1px solid var(--ring);
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute; top:-40px; right:-40px;
    width:120px; height:120px; border-radius:50%;
    background:radial-gradient(circle, #FFE9D6 0%, transparent 70%);
  }
  h1{
    font-family:'Jua', sans-serif;
    font-size:22px; margin:0 0 4px;
    display:flex; align-items:center; gap:8px;
  }
  .sub{ color:var(--ink-soft); font-size:13.5px; margin:0 0 20px; }

  .dots{ display:flex; gap:6px; margin-bottom:22px; }
  .dot{ flex:1; height:6px; border-radius:6px; background:var(--ring); overflow:hidden; }
  .dot i{ display:block; height:100%; width:0%; background:var(--sky); transition:width .3s ease; }
  .dot.done i{ width:100%; background:var(--ok); }
  .dot.cur i{ width:100%; background:var(--sky); }

  .qnum{ font-size:12.5px; color:var(--sky-deep); font-weight:700; margin-bottom:6px; }
  .qtext{ font-size:18px; line-height:1.5; margin:0 0 20px; min-height:54px; }

  .opts{ display:grid; gap:10px; }
  .opt{
    text-align:left;
    border:1.5px solid var(--ring);
    background:#FFFDF9;
    border-radius:16px;
    padding:14px 16px;
    font-size:15px;
    font-family:inherit;
    color:var(--ink);
    cursor:pointer;
    transition:transform .12s ease, border-color .15s ease, background .15s ease;
  }
  .opt:active{ transform:scale(.98); }
  .opt:hover{ border-color:var(--sky); }
  .opt.correct{ background:#EAF9F1; border-color:var(--ok); color:#2E6B4E; font-weight:700; }
  .opt.wrong{ background:#FFEEEC; border-color:var(--bad); color:#B23B32; }
  .opt[disabled]{ cursor:default; }
  .opt[disabled]:not(.correct):not(.wrong){ opacity:.5; }

  .feedback{
    margin-top:16px; font-size:13.5px; color:var(--ink-soft);
    min-height:18px;
  }
  .next{
    margin-top:18px; width:100%; padding:14px;
    border:none; border-radius:16px;
    background:var(--sky); color:#fff; font-family:'Jua',sans-serif;
    font-size:15px; cursor:pointer; opacity:0; pointer-events:none;
    transition:opacity .2s ease;
  }
  .next.show{ opacity:1; pointer-events:auto; }
  .next:active{ transform:scale(.98); }

  /* result screen */
  .result{ text-align:center; display:none; }
  .result.show{ display:block; }
  .quiz{ display:block; }
  .quiz.hide{ display:none; }
  .score{
    font-family:'Jua', sans-serif;
    font-size:44px; color:var(--sky-deep); margin:6px 0 2px;
  }
  .score small{ font-size:16px; color:var(--ink-soft); font-family:'Gowun Dodum',sans-serif; }
  .msg{ font-size:14.5px; color:var(--ink-soft); margin-bottom:18px; }
  .best{
    display:inline-flex; gap:6px; align-items:center;
    background:#FFF6E5; color:#9C7A1F; border-radius:999px;
    padding:6px 14px; font-size:12.5px; font-weight:700; margin-bottom:20px;
  }
  .row{ display:flex; gap:10px; }
  .btn{
    flex:1; padding:13px; border-radius:16px; border:none;
    font-family:'Jua',sans-serif; font-size:14.5px; cursor:pointer;
  }
  .btn.share{ background:var(--yolk); color:#5C450A; }
  .btn.done{ background:#F3EFE6; color:var(--ink-soft); }
  .btn:active{ transform:scale(.98); }
  .timer{ margin-top:16px; font-size:12px; color:var(--ink-soft); }
</style>
</head>
<body>
<div class="stage">
  <div class="brand">🐣 <b>오늘의게임</b> · 오늘의 상식퀴즈</div>

  <div class="card">
    <div class="quiz" id="quizView">
      <h1>🧠 오늘의 상식퀴즈</h1>
      <p class="sub">매일 자정, 새로운 5문제가 찾아와요</p>

      <div class="dots" id="dots"></div>
      <div class="qnum" id="qnum">1 / 5</div>
      <p class="qtext" id="qtext"></p>
      <div class="opts" id="opts"></div>
      <p class="feedback" id="feedback"></p>
      <button class="next" id="nextBtn">다음 문제</button>
    </div>

    <div class="result" id="resultView">
      <h1 style="justify-content:center">🎉 오늘의 결과</h1>
      <div class="score" id="scoreText">0<small>/5</small></div>
      <p class="msg" id="msgText"></p>
      <div class="best" id="bestBadge">🏆 최고기록 0/5</div>
      <div class="row">
        <button class="btn share" id="shareBtn">결과 공유하기</button>
        <button class="btn done" id="againBtn">내일 또 만나요</button>
      </div>
      <p class="timer" id="timerText"></p>
    </div>
  </div>
</div>

<script>
(function(){
  const BANK = [
    {q:"세계에서 가장 넓은 나라는?", a:["러시아","캐나다","중국","미국"], c:0},
    {q:"우리 몸에서 가장 큰 장기는?", a:["간","피부","폐","심장"], c:1},
    {q:"태양계에서 가장 큰 행성은?", a:["토성","지구","목성","해왕성"], c:2},
    {q:"김치를 담글 때 꼭 필요한 재료가 아닌 것은?", a:["배추","고춧가루","마늘","커피"], c:3},
    {q:"세종대왕이 만든 문자는?", a:["한글","한자","가나","알파벳"], c:0},
    {q:"1년은 총 몇 주(週)에 가까울까?", a:["42주","52주","62주","72주"], c:1},
    {q:"물이 어는 온도는 섭씨 몇 도?", a:["0도","10도","-10도","100도"], c:0},
    {q:"피자의 발상지로 알려진 나라는?", a:["프랑스","스페인","이탈리아","그리스"], c:2},
    {q:"사람의 뼈는 성인 기준 총 몇 개?", a:["106개","206개","306개","406개"], c:1},
    {q:"올림픽이 처음 열린 나라는?", a:["이탈리아","그리스","프랑스","영국"], c:1},
    {q:"커피의 주성분으로 각성 효과를 내는 것은?", a:["카페인","타닌","비타민C","나트륨"], c:0},
    {q:"무지개는 총 몇 가지 색으로 표현될까?", a:["5가지","6가지","7가지","8가지"], c:2},
    {q:"세계에서 인구가 가장 많은 나라는? (2020년대 기준)", a:["미국","인도","중국","인도네시아"], c:1},
    {q:"우리나라의 수도는?", a:["부산","인천","서울","대전"], c:2},
    {q:"낙타의 등에 있는 혹의 주된 역할은?", a:["체온조절","지방저장","무게중심","헤엄"], c:1},
    {q:"1분은 몇 초?", a:["50초","60초","100초","120초"], c:1},
    {q:"지구에서 가장 큰 대양은?", a:["대서양","인도양","태평양","북극해"], c:2},
    {q:"고양이의 평균 수명에 가장 가까운 것은?", a:["3~5년","6~8년","13~17년","25~30년"], c:2},
    {q:"우리나라 화폐 단위는?", a:["엔","위안","원","달러"], c:2},
    {q:"컴퓨터 데이터의 최소 단위는?", a:["바이트","비트","픽셀","폰트"], c:1},
    {q:"여름에서 가을로 넘어가는 절기는?", a:["입춘","입하","입추","입동"], c:2},
    {q:"세계에서 가장 긴 강은?", a:["아마존강","나일강","황하","한강"], c:1},
    {q:"라면을 처음 만든 나라로 알려진 곳은?", a:["한국","중국","일본","베트남"], c:2},
    {q:"우리 눈의 검은자위를 부르는 이름은?", a:["홍채","각막","동공","수정체"], c:2},
    {q:"1킬로그램은 몇 그램?", a:["10g","100g","1000g","10000g"], c:2},
    {q:"바다에 사는 가장 큰 동물은?", a:["백상아리","흰긴수염고래","향유고래","범고래"], c:1},
    {q:"우리나라 대표 명절이 아닌 것은?", a:["설날","추석","단오","할로윈"], c:3},
    {q:"에펠탑이 있는 도시는?", a:["런던","파리","로마","베를린"], c:1},
    {q:"물의 화학식은?", a:["CO2","O2","H2O","NaCl"], c:2},
    {q:"한 다스(dozen)는 몇 개?", a:["10개","12개","15개","20개"], c:1}
  ];
  const DAILY_COUNT = 5;

  function seedFromDate(d){
    const s = d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate();
    return s;
  }
  function mulberry32(seed){
    return function(){
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function pickDaily(bank, count, seed){
    const rand = mulberry32(seed);
    const idx = bank.map((_,i)=>i);
    for(let i=idx.length-1;i>0;i--){
      const j = Math.floor(rand()*(i+1));
      [idx[i],idx[j]]=[idx[j],idx[i]];
    }
    return idx.slice(0,count).map(i=>{
      const item = bank[i];
      // shuffle options too, seeded off the question index
      const optRand = mulberry32(seed + i*7 + 3);
      const order = item.a.map((_,k)=>k);
      for(let k=order.length-1;k>0;k--){
        const j = Math.floor(optRand()*(k+1));
        [order[k],order[j]]=[order[j],order[k]];
      }
      return {
        q:item.q,
        a: order.map(k=>item.a[k]),
        c: order.indexOf(item.c)
      };
    });
  }

  const todayKey = (()=>{ const d=new Date(); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; })();
  const STORAGE_RESULT = 'tg_quiz_result_' + todayKey;
  const STORAGE_BEST = 'tg_quiz_best';

  const questions = pickDaily(BANK, DAILY_COUNT, seedFromDate(new Date()));

  const quizView = document.getElementById('quizView');
  const resultView = document.getElementById('resultView');
  const dotsEl = document.getElementById('dots');
  const qnumEl = document.getElementById('qnum');
  const qtextEl = document.getElementById('qtext');
  const optsEl = document.getElementById('opts');
  const feedbackEl = document.getElementById('feedback');
  const nextBtn = document.getElementById('nextBtn');

  let cur = 0, score = 0, answered = false;

  // dots
  questions.forEach((_,i)=>{
    const d = document.createElement('div');
    d.className = 'dot' + (i===0 ? ' cur':'');
    d.innerHTML = '<i></i>';
    dotsEl.appendChild(d);
  });

  function renderQuestion(){
    const item = questions[cur];
    qnumEl.textContent = `${cur+1} / ${questions.length}`;
    qtextEl.textContent = item.q;
    optsEl.innerHTML = '';
    answered = false;
    feedbackEl.textContent = '';
    nextBtn.classList.remove('show');

    [...dotsEl.children].forEach((d,i)=>{
      d.className = 'dot' + (i<cur ? ' done' : i===cur ? ' cur' : '');
    });

    item.a.forEach((text, i)=>{
      const b = document.createElement('button');
      b.className = 'opt';
      b.textContent = text;
      b.addEventListener('click', ()=> selectAnswer(i));
      optsEl.appendChild(b);
    });
  }

  function selectAnswer(i){
    if(answered) return;
    answered = true;
    const item = questions[cur];
    const btns = [...optsEl.children];
    btns.forEach((b, idx)=>{
      b.disabled = true;
      if(idx === item.c) b.classList.add('correct');
      else if(idx === i) b.classList.add('wrong');
    });
    if(i === item.c){
      score++;
      feedbackEl.textContent = '정답이에요! 👍';
    } else {
      feedbackEl.textContent = '아쉬워요, 정답은 "' + item.a[item.c] + '" 였어요.';
    }
    nextBtn.classList.add('show');
    nextBtn.textContent = (cur === questions.length-1) ? '결과 보기' : '다음 문제';
  }

  nextBtn.addEventListener('click', ()=>{
    cur++;
    if(cur >= questions.length){
      finishQuiz();
    } else {
      renderQuestion();
    }
  });

  function nextResetTime(){
    const now = new Date();
    const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate()+1);
    const diff = tomorrow - now;
    const h = Math.floor(diff/3600000);
    const m = Math.floor((diff%3600000)/60000);
    return `${h}시간 ${m}분`;
  }

  function finishQuiz(){
    let best = parseInt(localStorage.getItem(STORAGE_BEST) || '0', 10);
    if(score > best){ best = score; localStorage.setItem(STORAGE_BEST, String(best)); }
    localStorage.setItem(STORAGE_RESULT, String(score));

    quizView.classList.add('hide');
    resultView.classList.add('show');
    document.getElementById('scoreText').innerHTML = `${score}<small>/${questions.length}</small>`;
    document.getElementById('bestBadge').textContent = `🏆 최고기록 ${best}/${questions.length}`;

    let msg = '';
    if(score === questions.length) msg = '완벽해요! 오늘의 상식왕이에요 👑';
    else if(score >= 3) msg = '꽤 잘하셨어요! 내일도 도전해보세요';
    else msg = '괜찮아요, 내일 다시 도전해봐요!';
    document.getElementById('msgText').textContent = msg;
    document.getElementById('timerText').textContent = `⏰ 다음 문제는 ${nextResetTime()} 후에 열려요`;
  }

  function showSavedResult(saved){
    quizView.classList.add('hide');
    resultView.classList.add('show');
    const best = parseInt(localStorage.getItem(STORAGE_BEST) || '0', 10);
    document.getElementById('scoreText').innerHTML = `${saved}<small>/${questions.length}</small>`;
    document.getElementById('bestBadge').textContent = `🏆 최고기록 ${best}/${questions.length}`;
    document.getElementById('msgText').textContent = '오늘은 이미 퀴즈를 풀었어요. 내일 또 만나요!';
    document.getElementById('timerText').textContent = `⏰ 다음 문제는 ${nextResetTime()} 후에 열려요`;
  }

  document.getElementById('shareBtn').addEventListener('click', ()=>{
    const text = `오늘의 상식퀴즈 결과: ${document.getElementById('scoreText').textContent.replace('/', ' / ')} 🧠\\ntodaygame.co.kr 에서 도전해보세요!`;
    if(navigator.share){
      navigator.share({ text }).catch(()=>{});
    } else if(navigator.clipboard){
      navigator.clipboard.writeText(text);
      const btn = document.getElementById('shareBtn');
      const orig = btn.textContent;
      btn.textContent = '복사됐어요!';
      setTimeout(()=> btn.textContent = orig, 1500);
    }
  });
  document.getElementById('againBtn').addEventListener('click', ()=>{
    // no-op besides feedback, since daily quiz is locked
    const btn = document.getElementById('againBtn');
    const orig = btn.textContent;
    btn.textContent = '내일 만나요 🐣';
    setTimeout(()=> btn.textContent = orig, 1200);
  });

  // init
  const saved = localStorage.getItem(STORAGE_RESULT);
  if(saved !== null){
    showSavedResult(parseInt(saved,10));
  } else {
    renderQuestion();
  }
})();
</script>
</body>
</html>
