<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>리듬 배틀 아레나 | 오늘의게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0E1A;
    --bg2:#131A2E;
    --cyan:#00E5FF;
    --magenta:#FF3EC9;
    --yellow:#FFE156;
    --violet:#7B5CFA;
    --green:#4CFFA0;
    --red:#FF4D6D;
    --line:#26304A;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{ height:100%; }
  body{
    margin:0; background:
      radial-gradient(60% 40% at 50% 0%, #1B2440 0%, transparent 60%),
      var(--bg);
    color:#EAF0FF;
    font-family:'Jua', sans-serif;
    overflow:hidden;
    touch-action:none;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh;
  }
  .wrap{ width:100%; max-width:480px; height:100vh; max-height:900px; position:relative; display:flex; flex-direction:column; }

  /* HUD */
  .hud{ padding:14px 14px 8px; }
  .versus{ display:flex; align-items:center; gap:8px; }
  .fighter{ flex:1; }
  .fighter .name{ font-size:12px; color:#9AA7C7; margin-bottom:4px; display:flex; justify-content:space-between; }
  .hpbar{ height:14px; border-radius:8px; background:#1B2440; overflow:hidden; border:1px solid var(--line); }
  .hpbar i{ display:block; height:100%; width:100%; transition:width .25s ease; }
  .hpbar.me i{ background:linear-gradient(90deg, var(--cyan), var(--green)); }
  .hpbar.rival i{ background:linear-gradient(90deg, var(--magenta), var(--red)); }
  .vs-mark{ font-family:'Orbitron', sans-serif; font-weight:800; color:var(--yellow); font-size:16px; padding:0 4px; }
  .avatars{ display:flex; justify-content:space-between; margin-top:6px; font-size:30px; }

  .statusbar{ display:flex; justify-content:space-between; align-items:baseline; margin-top:10px; padding:0 2px; }
  .combo{ font-family:'Orbitron', sans-serif; font-weight:800; font-size:22px; color:var(--yellow); }
  .combo small{ font-family:'Jua',sans-serif; font-size:11px; color:#9AA7C7; margin-left:4px; }
  .score{ font-family:'Orbitron', sans-serif; font-weight:600; font-size:14px; color:#9AA7C7; }

  /* playfield */
  .field{ flex:1; position:relative; margin:8px 12px 0; border-radius:20px; overflow:hidden; background:
      linear-gradient(180deg, var(--bg2) 0%, #0E1426 100%); border:1px solid var(--line); }
  .lanes{ position:absolute; inset:0; display:flex; }
  .lane{ flex:1; position:relative; border-left:1px solid rgba(255,255,255,.05); }
  .lane:first-child{ border-left:none; }
  .hitline{ position:absolute; left:0; right:0; bottom:86px; height:4px; background:linear-gradient(90deg, transparent, var(--cyan), transparent); box-shadow:0 0 16px var(--cyan); }
  .note{ position:absolute; left:8%; right:8%; height:26px; border-radius:8px; }
  .judge-pop{
    position:absolute; left:50%; top:38%; transform:translate(-50%,0);
    font-family:'Orbitron',sans-serif; font-weight:800; font-size:24px;
    opacity:0; pointer-events:none;
  }
  .judge-pop.show{ animation:pop .45s ease forwards; }
  @keyframes pop{
    0%{ opacity:0; transform:translate(-50%,10px) scale(.7); }
    30%{ opacity:1; transform:translate(-50%,-4px) scale(1.08); }
    100%{ opacity:0; transform:translate(-50%,-18px) scale(1); }
  }
  .shake{ animation:shake .28s ease; }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-8px); }
    40%{ transform:translateX(7px); }
    60%{ transform:translateX(-5px); }
    80%{ transform:translateX(4px); }
  }
  .burst{ position:absolute; width:6px; height:6px; border-radius:50%; pointer-events:none; }

  /* controls */
  .controls{ display:flex; gap:8px; padding:10px 12px 16px; }
  .padbtn{
    flex:1; height:64px; border-radius:16px; border:1px solid var(--line);
    background:#131A2E; color:#EAF0FF; font-family:'Orbitron',sans-serif; font-weight:800; font-size:16px;
    display:flex; align-items:center; justify-content:center;
  }
  .padbtn.active{ filter:brightness(1.6); }

  /* overlay screens */
  .overlay{
    position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(6,8,16,.88); text-align:center; padding:24px; z-index:5;
  }
  .overlay.show{ display:flex; }
  .overlay h1{ font-size:26px; margin:0 0 6px; }
  .overlay p{ color:#9AA7C7; font-size:13.5px; margin:0 0 22px; font-family:'Jua',sans-serif; }
  .overlay .big-emoji{ font-size:64px; margin-bottom:12px; }
  .btn{
    padding:14px 28px; border-radius:16px; border:none; cursor:pointer;
    font-family:'Jua',sans-serif; font-size:15px; background:var(--cyan); color:#06121A; margin:4px;
  }
  .btn.secondary{ background:#1B2440; color:#EAF0FF; border:1px solid var(--line); }
  .statline{ font-family:'Orbitron',sans-serif; font-size:13px; color:var(--yellow); margin-bottom:4px; }

  .brand{ position:absolute; top:8px; left:0; right:0; text-align:center; font-size:11px; color:#5E6A8C; z-index:2;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">🐣 오늘의게임 · 리듬 배틀 아레나</div>
  <div class="hud">
    <div class="versus">
      <div class="fighter">
        <div class="name"><span>생별이</span><span id="meHpText">100</span></div>
        <div class="hpbar me"><i id="meHp"></i></div>
      </div>
      <div class="vs-mark">VS</div>
      <div class="fighter">
        <div class="name"><span id="rivalHpText">100</span><span>폭스</span></div>
        <div class="hpbar rival"><i id="rivalHp"></i></div>
      </div>
    </div>
    <div class="avatars"><span>🐣</span><span>🦊</span></div>
    <div class="statusbar">
      <div class="combo" id="comboText">0<small>COMBO</small></div>
      <div class="score" id="scoreText">SCORE 0</div>
    </div>
  </div>

  <div class="field" id="field">
    <div class="lanes" id="lanes"></div>
    <div class="hitline"></div>
    <div class="judge-pop" id="judgePop"></div>

    <div class="overlay show" id="startOverlay">
      <div class="big-emoji">🐣⚔️🦊</div>
      <h1>리듬 배틀 아레나</h1>
      <p>노트를 정확히 맞춰서 라이벌 폭스의 체력을 깎아보세요!<br>놓치면 내 체력이 줄어들어요.</p>
      <button class="btn" id="startBtn">배틀 시작</button>
    </div>

    <div class="overlay" id="endOverlay">
      <div class="big-emoji" id="endEmoji">🏆</div>
      <h1 id="endTitle">승리!</h1>
      <div class="statline" id="endScore">SCORE 0</div>
      <div class="statline" id="endCombo">MAX COMBO 0</div>
      <p id="endDesc">생별이가 폭스를 이겼어요!</p>
      <div>
        <button class="btn" id="retryBtn">다시 도전</button>
        <button class="btn secondary" id="shareBtn2">결과 공유</button>
      </div>
    </div>
  </div>

  <div class="controls" id="controls">
    <div class="padbtn" data-lane="0">D</div>
    <div class="padbtn" data-lane="1">F</div>
    <div class="padbtn" data-lane="2">J</div>
    <div class="padbtn" data-lane="3">K</div>
  </div>
</div>

<script>
(function(){
  const LANES = 4;
  const LANE_COLORS = ['#00E5FF','#7B5CFA','#FFE156','#FF3EC9'];
  const KEYMAP = {'d':0,'f':1,'j':2,'k':3};
  const BPM = 128;
  const BEAT_MS = 60000/BPM;
  const NOTE_TRAVEL_MS = 1500; // time from top to hitline
  const HIT_WINDOW = { perfect:45, great:95, good:150 };

  // --- build chart ---
  function buildChart(){
    const chart = [];
    let t = 2000; // start delay
    const totalBeats = 128; // ~ song length
    let rngSeed = 12345;
    function rnd(){ rngSeed = (rngSeed*1103515245+12345)&0x7fffffff; return rngSeed/0x7fffffff; }
    for(let i=0;i<totalBeats;i++){
      const sub = i % 4;
      if(sub === 0 || rnd() > 0.35){
        const lane = Math.floor(rnd()*LANES);
        chart.push({ time: t, lane, hit:false, missed:false });
      }
      if(rnd() > 0.75){
        const lane2 = Math.floor(rnd()*LANES);
        chart.push({ time: t + BEAT_MS/2, lane: lane2, hit:false, missed:false });
      }
      t += BEAT_MS;
    }
    chart.sort((a,b)=>a.time-b.time);
    return chart;
  }

  let chart = buildChart();
  const songLen = chart[chart.length-1].time + 2000;

  const lanesEl = document.getElementById('lanes');
  const laneEls = [];
  for(let i=0;i<LANES;i++){
    const d = document.createElement('div');
    d.className = 'lane';
    lanesEl.appendChild(d);
    laneEls.push(d);
  }

  let meHp = 100, rivalHp = 100, combo = 0, maxCombo = 0, score = 0;
  let running = false, startTime = 0, rafId = null;
  let audioCtx = null;

  const meHpEl = document.getElementById('meHp');
  const rivalHpEl = document.getElementById('rivalHp');
  const meHpText = document.getElementById('meHpText');
  const rivalHpText = document.getElementById('rivalHpText');
  const comboText = document.getElementById('comboText');
  const scoreText = document.getElementById('scoreText');
  const field = document.getElementById('field');
  const judgePop = document.getElementById('judgePop');

  function ensureAudio(){
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }
  function beep(freq, dur, type, gain){
    if(!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    g.gain.value = gain || 0.06;
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start();
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.stop(audioCtx.currentTime + dur);
  }

  function updateHUD(){
    meHp = Math.max(0, Math.min(100, meHp));
    rivalHp = Math.max(0, Math.min(100, rivalHp));
    meHpEl.style.width = meHp + '%';
    rivalHpEl.style.width = rivalHp + '%';
    meHpText.textContent = Math.round(meHp);
    rivalHpText.textContent = Math.round(rivalHp);
    comboText.innerHTML = combo + '<small>COMBO</small>';
    scoreText.textContent = 'SCORE ' + score;
  }

  function popJudge(text, color){
    judgePop.textContent = text;
    judgePop.style.color = color;
    judgePop.classList.remove('show');
    void judgePop.offsetWidth;
    judgePop.classList.add('show');
  }

  function burstAt(lane){
    const laneEl = laneEls[lane];
    const rect = laneEl.getBoundingClientRect();
    const fieldRect = field.getBoundingClientRect();
    for(let i=0;i<8;i++){
      const b = document.createElement('div');
      b.className = 'burst';
      b.style.background = LANE_COLORS[lane];
      const x = rect.left - fieldRect.left + rect.width/2;
      const y = fieldRect.height - 96;
      b.style.left = x + 'px';
      b.style.top = y + 'px';
      field.appendChild(b);
      const ang = Math.random()*Math.PI*2;
      const dist = 20 + Math.random()*30;
      b.animate([
        { transform:'translate(0,0)', opacity:1 },
        { transform:`translate(${Math.cos(ang)*dist}px, ${Math.sin(ang)*dist}px)`, opacity:0 }
      ], { duration:400, easing:'ease-out' });
      setTimeout(()=> b.remove(), 420);
    }
  }

  function judgeHit(diff, lane){
    if(diff <= HIT_WINDOW.perfect){
      rivalHp -= 5.5; combo++; score += 300 + combo*2;
      popJudge('PERFECT', '#00E5FF'); burstAt(lane);
      beep(880,0.09,'square',0.05);
    } else if(diff <= HIT_WINDOW.great){
      rivalHp -= 3.2; combo++; score += 150 + combo;
      popJudge('GREAT', '#7B5CFA'); burstAt(lane);
      beep(660,0.08,'square',0.04);
    } else if(diff <= HIT_WINDOW.good){
      rivalHp -= 1.2; combo++; score += 60;
      popJudge('GOOD', '#FFE156');
      beep(440,0.07,'square',0.03);
    } else {
      registerMiss();
      return;
    }
    maxCombo = Math.max(maxCombo, combo);
    updateHUD();
    checkEnd();
  }

  function registerMiss(){
    combo = 0; meHp -= 6;
    popJudge('MISS', '#FF4D6D');
    field.classList.remove('shake'); void field.offsetWidth; field.classList.add('shake');
    beep(180,0.15,'sawtooth',0.05);
    updateHUD();
    checkEnd();
  }

  function checkEnd(){
    if(rivalHp <= 0){ endGame(true); }
    else if(meHp <= 0){ endGame(false); }
  }

  function endGame(win){
    running = false;
    cancelAnimationFrame(rafId);
    document.getElementById('endOverlay').classList.add('show');
    document.getElementById('endEmoji').textContent = win ? '🏆' : '💥';
    document.getElementById('endTitle').textContent = win ? '승리!' : '패배...';
    document.getElementById('endDesc').textContent = win ? '생별이가 폭스를 이겼어요!' : '폭스에게 아쉽게 졌어요. 다시 도전해보세요!';
    document.getElementById('endScore').textContent = 'SCORE ' + score;
    document.getElementById('endCombo').textContent = 'MAX COMBO ' + maxCombo;
  }

  // note DOM pool
  chart.forEach(n=>{
    const el = document.createElement('div');
    el.className = 'note';
    el.style.background = `linear-gradient(180deg, ${LANE_COLORS[n.lane]}, transparent)`;
    el.style.boxShadow = `0 0 10px ${LANE_COLORS[n.lane]}`;
    el.style.display = 'none';
    laneEls[n.lane].appendChild(el);
    n.el = el;
  });

  function loop(){
    if(!running) return;
    const now = performance.now() - startTime;
    const fieldH = field.clientHeight;
    const hitY = fieldH - 86;

    chart.forEach(n=>{
      if(n.hit) return;
      const dt = n.time - now; // ms until hit
      if(dt < -300 && !n.missed){
        n.missed = true;
        n.el.style.display = 'none';
        registerMiss();
        return;
      }
      if(dt > NOTE_TRAVEL_MS || dt < -300){
        n.el.style.display = 'none';
        return;
      }
      n.el.style.display = 'block';
      const progress = 1 - (dt / NOTE_TRAVEL_MS);
      const y = progress * hitY;
      n.el.style.top = Math.max(-30, y - 13) + 'px';
    });

    if(now > songLen + 500){
      endGame(rivalHp < meHp);
      return;
    }

    rafId = requestAnimationFrame(loop);
  }

  function tryHitLane(lane){
    if(!running) return;
    const now = performance.now() - startTime;
    let best = null, bestDiff = Infinity;
    chart.forEach(n=>{
      if(n.hit || n.missed || n.lane !== lane) return;
      const diff = Math.abs(n.time - now);
      if(diff < bestDiff){ bestDiff = diff; best = n; }
    });
    if(best && bestDiff <= HIT_WINDOW.good){
      best.hit = true;
      best.el.style.display = 'none';
      judgeHit(bestDiff, lane);
    }
  }

  // controls
  const padBtns = document.querySelectorAll('.padbtn');
  padBtns.forEach(btn=>{
    const lane = parseInt(btn.dataset.lane,10);
    const activate = (e)=>{
      e.preventDefault();
      ensureAudio();
      btn.classList.add('active');
      tryHitLane(lane);
      setTimeout(()=> btn.classList.remove('active'), 90);
    };
    btn.addEventListener('touchstart', activate, {passive:false});
    btn.addEventListener('mousedown', activate);
  });
  window.addEventListener('keydown', (e)=>{
    const k = e.key.toLowerCase();
    if(k in KEYMAP){ ensureAudio(); tryHitLane(KEYMAP[k]); }
  });

  document.getElementById('startBtn').addEventListener('click', ()=>{
    ensureAudio();
    document.getElementById('startOverlay').classList.remove('show');
    meHp = 100; rivalHp = 100; combo = 0; maxCombo = 0; score = 0;
    chart = buildChart();
    // rebuild note elements
    laneEls.forEach(l=> l.querySelectorAll('.note').forEach(n=>n.remove()));
    chart.forEach(n=>{
      const el = document.createElement('div');
      el.className = 'note';
      el.style.background = `linear-gradient(180deg, ${LANE_COLORS[n.lane]}, transparent)`;
      el.style.boxShadow = `0 0 10px ${LANE_COLORS[n.lane]}`;
      el.style.display = 'none';
      laneEls[n.lane].appendChild(el);
      n.el = el;
    });
    updateHUD();
    running = true;
    startTime = performance.now();
    rafId = requestAnimationFrame(loop);
  });

  document.getElementById('retryBtn').addEventListener('click', ()=>{
    document.getElementById('endOverlay').classList.remove('show');
    document.getElementById('startOverlay').classList.add('show');
  });

  document.getElementById('shareBtn2').addEventListener('click', ()=>{
    const text = `리듬 배틀 아레나 결과: SCORE ${score} / MAX COMBO ${maxCombo} 🐣⚔️🦊\\ntodaygame.co.kr 에서 도전해보세요!`;
    if(navigator.share){ navigator.share({text}).catch(()=>{}); }
    else if(navigator.clipboard){
      navigator.clipboard.writeText(text);
      const b = document.getElementById('shareBtn2');
      const o = b.textContent; b.textContent = '복사됐어요!';
      setTimeout(()=> b.textContent = o, 1400);
    }
  });

  updateHUD();
})();
</script>
</body>
</html>
