<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a2536"/>
      <stop offset="100%" stop-color="#060911"/>
    </radialGradient>
    <linearGradient id="ship" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#ff0055"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="220" height="220" rx="44" fill="url(#bg)" />

  <!-- Stars -->
  <circle cx="35" cy="45" r="2" fill="#fff" opacity="0.8" />
  <circle cx="180" cy="30" r="1.5" fill="#fff" opacity="0.9" />
  <circle cx="160" cy="180" r="2.5" fill="#ffd166" opacity="0.8" filter="url(#glow)" />
  <circle cx="40" cy="160" r="1.5" fill="#fff" opacity="0.6" />

  <!-- Flaming Meteor -->
  <g transform="translate(160, 75) rotate(-25)">
    <path d="M-20,-10 C-40,0 -50,20 -70,25 C-40,30 -30,50 0,40 C30,30 20,-20 -20,-10 Z" fill="url(#flame)" opacity="0.75" />
    <path d="M0,0 L14,-8 L26,4 L18,22 L-4,24 L-12,10 Z" fill="#e07a5f" stroke="#f4a261" stroke-width="2.5" stroke-linejoin="round" />
    <circle cx="4" cy="8" r="4" fill="#3d1e16" opacity="0.6" />
  </g>

  <!-- Spaceship -->
  <g transform="translate(100, 125)" filter="url(#glow)">
    <!-- Thruster Flame -->
    <polygon points="-8,30 0,55 8,30" fill="url(#flame)" />
    <!-- Wings -->
    <polygon points="-42,20 -12,-5 0,-35 12,-5 42,20 22,25 0,18 -22,25" fill="url(#ship)" stroke="#90e0ef" stroke-width="2" />
    <!-- Cockpit -->
    <ellipse cx="0" cy="-5" rx="7" ry="14" fill="#ffffff" opacity="0.9" />
    <!-- Wing Lights -->
    <circle cx="-38" cy="18" r="3" fill="#ff0055" />
    <circle cx="38" cy="18" r="3" fill="#00f0ff" />
  </g>

  <!-- Ether Star Collectible -->
  <g transform="translate(55, 80) scale(1.2)" filter="url(#glow)">
    <polygon points="0,-12 3.5,-3.5 12,0 3.5,3.5 0,12 -3.5,3.5 -12,0 -3.5,-3.5" fill="#ffd166" />
  </g>
</svg>
