# 홍보 자동화 — 30분마다: 텔레그램 답(승인 · 반려 · 수정) 처리 → 기한 지남 · 멈춘 제작 정리 → "승인 + 시각 지남 + 미게시" 만 게시
# 예약은 master 에 있을 때만 돈다. 붐빌 때 늦을 수 있다 (게시 시각 ± 수십 분).
# 시험: feature/marketing 에 커밋 메시지 [mkt-run] 으로 push 하면 한 번 돈다 — master 병합 전에 push 트리거는 지운다.
name: mkt-publish

on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch: {}
  push:
    branches: [feature/marketing]
    paths: ["marketing/**", ".github/workflows/mkt-*.yml"]

concurrency:
  group: mkt-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[mkt-run]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MKT_RUNNER: actions
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_ADMIN_CHAT_ID: ${{ secrets.TG_ADMIN_CHAT_ID }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      CHANNEL_MODE_INSTAGRAM: ${{ vars.CHANNEL_MODE_INSTAGRAM || 'mock' }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: marketing/package-lock.json
      - name: 설치
        working-directory: marketing
        run: npm ci --no-audit --no-fund
      - name: 승인 처리 · 게시
        id: pub
        run: node marketing/run.js publish
      # 관리자가 "문구 다시 만들기 · 다시 제작" 을 누른 게 있을 때만 (녹화 · 편집에 FFmpeg 필요)
      - name: FFmpeg
        if: steps.pub.outputs.redo == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: 다시 만들기
        if: steps.pub.outputs.redo == 'true'
        run: node marketing/run.js redo
